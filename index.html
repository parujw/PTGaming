<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เศรษฐีบางกอก</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;600&family=IBM+Plex+Sans+Thai:wght@400;600&display=swap">
<style>
/* Layout: a Bangkok-at-night board (taxi pink + BTS green on navy), board left, control desk right; stacks on phones */
:root{
  --night:#151738; --panel:#1f2250; --panel-2:#2a2e66; --ink:#f3f1ff; --muted:#a9a8d6;
  --taxi:#ff4f97; --bts:#7bd13a; --gold:#ffcb3d; --tile:#f6f5fc; --tile-ink:#1b1c33; --line:#3a3e80;
  --display:"Mitr","Noto Sans Thai","Leelawadee UI",sans-serif;
  --body:"IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
button{font:inherit;cursor:pointer}
button:focus-visible,[role=button]:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,360px);gap:20px;max-width:1180px;margin:0 auto;align-items:start}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr)}}

/* ---------- board ---------- */
.board-wrap{container-type:inline-size;width:100%;max-width:780px;justify-self:center}
.board{display:grid;aspect-ratio:1;max-width:100%;
  grid-template-columns:1.45fr repeat(9,1fr) 1.45fr;grid-template-rows:1.45fr repeat(9,1fr) 1.45fr;
  gap:.25cqw;background:var(--line);padding:.25cqw;border-radius:1.2cqw;font-size:1.32cqw}
.tile{position:relative;background:var(--tile);color:var(--tile-ink);overflow:hidden;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:.7cqw .35cqw;line-height:1.12;cursor:pointer;border-radius:.3cqw}
.tile:hover{filter:brightness(.94)}
.tile.sel{box-shadow:inset 0 0 0 .45cqw var(--gold)}
.tile .band{position:absolute;background:var(--g)}
.tile.b .band{left:0;right:0;top:0;height:22%} .tile.b{padding-top:calc(22% + .3cqw)}
.tile.t .band{left:0;right:0;bottom:0;height:22%} .tile.t{padding-bottom:calc(22% + .3cqw)}
.tile.l .band{top:0;bottom:0;right:0;width:20%} .tile.l{padding-right:calc(20% + .3cqw)}
.tile.r .band{top:0;bottom:0;left:0;width:20%} .tile.r{padding-left:calc(20% + .3cqw)}
.tile .tn{font-family:var(--display);font-weight:600;font-size:1em;word-break:break-word}
.tile .tp{font-size:.9em;opacity:.7;font-variant-numeric:tabular-nums}
.tile .ic{font-size:1.9em;line-height:1}
.tile.corner{background:#fff2c9}
.tile.corner .tn{font-size:1.15em}
.tile .own{position:absolute;top:0;right:0;width:0;height:0;border-style:solid;border-width:0 2.4cqw 2.4cqw 0;border-color:transparent var(--o) transparent transparent}
.tile.mort{background:repeating-linear-gradient(45deg,#e4e3ef 0 .6cqw,#f6f5fc .6cqw 1.2cqw)}
.tile .bld{position:absolute;left:.3cqw;bottom:.1cqw;font-size:1.05em;letter-spacing:-.15em}
.tile .toks{position:absolute;right:.2cqw;bottom:.1cqw;display:flex;flex-wrap:wrap-reverse;justify-content:flex-end;max-width:90%;font-size:2.1em;line-height:1}
.tile .toks span{filter:drop-shadow(0 .15cqw 0 var(--pc))}
@container (max-width:520px){.tile .tp{display:none}.board{font-size:1.6cqw}}

.center{grid-area:2/2/11/11;background:radial-gradient(120% 90% at 50% 0%,#2b2f72 0%,var(--night) 70%);border-radius:.6cqw;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6cqw;padding:2.5cqw;text-align:center;font-size:1.9cqw}
.logo{font-family:var(--display);line-height:1;margin:0}
.logo .l1{display:block;font-size:6.4cqw;font-weight:600;color:var(--taxi);text-shadow:0 .5cqw 0 #7a1747;letter-spacing:.02em}
.logo .l2{display:block;font-size:2.2cqw;font-weight:400;color:var(--bts);margin-top:1.2cqw;letter-spacing:.08em}
.dice{display:flex;gap:1.6cqw}
.die{width:7.5cqw;height:7.5cqw;background:var(--ink);color:var(--night);border-radius:1.4cqw;display:grid;place-items:center;
  font-family:var(--display);font-weight:600;font-size:4.4cqw;box-shadow:0 .6cqw 0 var(--muted)}
.die.roll{animation:shake .12s infinite alternate}
@keyframes shake{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.status{font-family:var(--display);font-size:2.3cqw;color:var(--gold);min-height:1.2em}
.card{width:min(100%,46cqw);background:var(--ink);color:var(--tile-ink);border-radius:1.2cqw;padding:1.4cqw 2cqw;font-size:1.8cqw;line-height:1.35;
  border-top:1.2cqw solid var(--cc,var(--taxi))}
.card .deck{font-family:var(--display);font-size:1.5cqw;letter-spacing:.06em;opacity:.65;display:block;margin-bottom:.4cqw}
.card[hidden]{display:none}
@media (prefers-reduced-motion:reduce){.die.roll{animation:none}}

/* ---------- side panel ---------- */
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.box{background:var(--panel);border-radius:14px;padding:14px 16px;min-width:0}
.box h2{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
.players{display:grid;gap:8px}
.pl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--panel-2);border-left:4px solid var(--pc)}
.pl.cur{outline:2px solid var(--gold)}
.pl.out{opacity:.4;text-decoration:line-through}
.pl .tk{font-size:24px;line-height:1}
.pl .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .meta{font-size:12px;color:var(--muted)}
.pl .money{font-family:var(--display);font-variant-numeric:tabular-nums;color:var(--bts)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--panel-2);color:var(--ink);font-weight:600}
.btn.main{background:var(--taxi);color:#fff;box-shadow:0 3px 0 #9b1f57}
.btn.go{background:var(--bts);color:#13240a;box-shadow:0 3px 0 #3f7317}
.btn.sm{padding:5px 9px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}
.info .ti{font-family:var(--display);font-size:20px;margin:0 0 2px}
.info .sub{color:var(--muted);font-size:13px;margin:0 0 8px}
.rent{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.rent td{padding:2px 0;border-bottom:1px solid var(--line)}
.rent td:last-child{text-align:right}
.rent tr.on td{color:var(--gold);font-weight:600}
.props{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:420px;overflow:auto}
.mdeed{display:grid;gap:4px;align-content:start;background:var(--tile);color:var(--tile-ink);border-radius:8px;padding:0 0 8px;overflow:hidden;font-size:12px;min-width:0}
.mdeed.mortd{background:repeating-linear-gradient(45deg,#e4e3ef 0 6px,#f6f5fc 6px 12px)}
.mdh{border:0;background:var(--g,#cfd0e6);color:#fff;font-family:var(--display);font-weight:600;font-size:13px;padding:6px 8px;text-align:left;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.mdh.plain{background:#cfd0e6;color:var(--tile-ink);text-shadow:none}
.mds{padding:0 8px;line-height:1.3}
.mdeed .why{padding:0 8px;color:#9a5b00}
.mdeed .bt{display:flex;flex-wrap:wrap;gap:4px;padding:0 6px}
.mdeed .btn.sm{background:#e6e5f2;color:var(--tile-ink);font-size:12px;padding:4px 7px}
.mdeed .btn.sm:not(:disabled){background:var(--panel-2);color:var(--ink)}
.tdeed{position:relative;background:#fffdf6;color:var(--tile-ink);border-radius:8px;padding:8px;box-shadow:0 2px 0 rgba(0,0,0,.25);max-width:320px;margin-top:6px}
.tdeed.mortd{background:repeating-linear-gradient(45deg,#ece9f2 0 8px,#fffdf6 8px 16px)}
.td-h{background:var(--g);color:#fff;text-align:center;border:2px solid var(--tile-ink);padding:6px 4px 8px;display:grid;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.td-h small{font-size:10px;letter-spacing:.2em;opacity:.9}
.td-h b{font-family:var(--display);font-size:18px;line-height:1.2}
.td-h.plain{background:transparent;color:var(--tile-ink);border:0;text-shadow:none}
.td-ic{font-size:30px;line-height:1}
.tdeed table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;margin-top:6px}
.tdeed td{padding:2px 4px}
.tdeed td:last-child{text-align:right}
.tdeed tr.on td{background:#ffe9a8;font-weight:600}
.td-f{display:grid;gap:2px;text-align:center;font-size:11px;border-top:1px solid #d9d6e6;margin-top:6px;padding-top:6px;color:#4a4a63}
.td-p{text-align:center;font-family:var(--display);font-size:13px;margin-top:4px}
.td-stamp{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%) rotate(-14deg);border:3px solid #c8102e;color:#c8102e;font-family:var(--display);font-size:22px;padding:2px 14px;border-radius:8px;background:rgba(255,253,246,.85)}
/* chance / community chest decks */
.piles{display:flex;gap:2cqw;justify-content:center}
.pile{width:15cqw;aspect-ratio:1.45;position:relative;transform:rotate(-4deg);font-size:1.15cqw}
.pile.chest{transform:rotate(4deg)}
.pile>*{position:absolute;inset:0;border-radius:.8cqw;box-shadow:.4cqw .4cqw 0 rgba(0,0,0,.35),.8cqw .8cqw 0 rgba(255,255,255,.15)}
.mc-back{display:grid;place-content:center;justify-items:center;gap:.4cqw;color:#fff;font-family:var(--display);text-align:center;border:.35cqw solid #fff}
.mc-back.chance{background:repeating-linear-gradient(135deg,#f0a500 0 1.2cqw,#e69400 1.2cqw 2.4cqw)}
.mc-back.chest{background:repeating-linear-gradient(135deg,#e3407f 0 1.2cqw,#d03070 1.2cqw 2.4cqw)}
.mc-back span{font-size:2.6em;line-height:1}
.mc-back b{font-size:1.25em;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.mc-front{display:grid;align-content:start;justify-items:center;gap:.3em;background:#fffdf6;color:var(--tile-ink);border:.35cqw solid var(--dc);padding:.5em .6em;text-align:center;overflow:hidden}
.mc-front.chance{--dc:#e69400}.mc-front.chest{--dc:#d03070}
.mc-h{font-family:var(--display);font-size:.95em;color:var(--dc);letter-spacing:.06em}
.mc-ic{font-size:1.9em;line-height:1}
.mc-t{font-size:.85em;line-height:1.3}
.mc-e{font-family:var(--display);font-size:.95em;color:var(--dc);margin-top:auto}
.pile.last .mc-t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mcflip{width:min(52%,380px);aspect-ratio:1.45;position:relative;perspective:1200px;font-size:clamp(11px,2.2cqw,20px)}
.mc-inner{position:absolute;inset:0;transform-style:preserve-3d;animation:flipc .7s .15s cubic-bezier(.3,1.3,.5,1) both}
.mc-inner>*{position:absolute;inset:0;border-radius:1.2cqw;backface-visibility:hidden;box-shadow:0 1.6cqw 5cqw rgba(0,0,0,.55)}
.mc-inner .mc-back{transform:rotateY(180deg);font-size:1.4em}
.mc-inner .mc-front{padding:1em 1.2em;gap:.45em}
.mc-inner .mc-ic{font-size:2.6em}
.mc-inner .mc-t{font-size:1.05em}
.mc-inner .mc-e{font-size:1.1em}
@keyframes flipc{from{transform:translateY(18cqw) rotateY(180deg) scale(.5)}60%{transform:translateY(0) rotateY(-12deg) scale(1.04)}to{transform:none}}
.mc-who{position:absolute;left:50%;top:100%;transform:translate(-50%,1.2cqw);white-space:nowrap;background:var(--panel);color:var(--ink);border-radius:999px;padding:.4em 1em;font-size:.8em}
body.lowmo .mc-inner{animation:none}
.pr{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px}
.pr .sw{width:10px;height:24px;border-radius:3px;background:var(--g)}
.pr .bt{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.log{list-style:none;margin:0;padding:0;font-size:13px;max-height:220px;overflow:auto;display:grid;gap:4px}
.log li{color:var(--muted)} .log li:first-child{color:var(--ink)}

/* ---------- setup / overlay ---------- */
.ov{position:fixed;inset:0;background:rgba(10,11,30,.82);display:grid;place-items:center;z-index:10;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.dlg{background:var(--panel);border-radius:18px;padding:22px;width:min(560px,100%);border-top:6px solid var(--taxi)}
.dlg h1{font-family:var(--display);color:var(--taxi);margin:0;font-size:30px;line-height:1.1;text-wrap:balance}
.dlg p{color:var(--muted);margin:6px 0 16px}
.slot{display:grid;grid-template-columns:auto minmax(0,1fr) 72px 88px;gap:8px;align-items:center;margin-bottom:8px}
.slot input[type=text],.slot select{width:100%;background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;min-width:0}
.slot input[type=checkbox]{width:20px;height:20px;accent-color:var(--taxi)}
@media (max-width:460px){.slot{grid-template-columns:auto minmax(0,1fr) 64px;}.slot select.kind{grid-column:2/4}}
.rules{font-size:13px;color:var(--muted);margin:14px 0;padding-left:18px}
.win{text-align:center}
.h2row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px}
.h2row h2{margin:0}
.tag{font-family:var(--display);font-size:12px;letter-spacing:.08em;background:var(--taxi);color:#fff;border-radius:6px;padding:1px 8px}
.iconbtn{border:0;background:var(--panel-2);color:var(--ink);border-radius:8px;padding:3px 9px;font-size:15px;line-height:1.4}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--night);padding:4px;border-radius:12px;margin-bottom:14px}
.tabs button{border:0;border-radius:9px;padding:9px;background:transparent;color:var(--muted);font-weight:600}
.tabs button[aria-selected=true]{background:var(--panel-2);color:var(--ink)}
.field{display:grid;gap:4px;margin-bottom:10px;font-size:13px;color:var(--muted)}
.field input,.field select{background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px;font:inherit;min-width:0;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.row>.field{flex:1 1 140px;margin:0}
.code{font-family:var(--display);font-size:44px;letter-spacing:.18em;color:var(--gold);line-height:1;margin:6px 0 4px}
.code-in{text-transform:uppercase;letter-spacing:.2em;font-family:var(--display)}
.seats{display:grid;gap:6px;margin:12px 0}
.seat{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel-2);border-radius:10px;padding:8px 10px;border-left:4px solid var(--pc)}
.seat .tk{font-size:22px}
.rooms{display:grid;gap:6px;margin-top:8px}
.room{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--panel-2);border-radius:10px;padding:8px 10px;font-size:14px}
.err{color:var(--taxi);font-size:13px;min-height:1.2em;margin:6px 0 0}
.sep{border:0;border-top:1px solid var(--line);margin:16px 0}
.tools{display:flex;gap:6px}
.reacts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.why{display:block;font-size:11px;color:var(--gold);line-height:1.3}
.pl.low{animation:lowp 1.6s ease-in-out infinite}
.pl.low .money{color:#ff6b6b}
.pl.low .tk{filter:grayscale(1)}
@keyframes lowp{50%{background:#3a1d3e}}
.resume{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:var(--panel-2);border-radius:10px;padding:10px 12px;margin-bottom:12px}
fieldset{border:1px solid var(--line);border-radius:10px;margin:0 0 10px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:4px 16px}
legend{font-family:var(--display);font-size:13px;color:var(--muted);padding:0 4px}
.opt{display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.opt input{accent-color:var(--taxi);width:16px;height:16px}
.tbl{overflow-x:auto;margin:0 0 16px}
.rank{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;text-align:left}
.rank th{font-family:var(--display);font-weight:400;color:var(--muted);font-size:12px;padding:4px 6px;border-bottom:1px solid var(--line)}
.rank td{padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
.rank tr.top td{color:var(--gold);font-weight:600}

/* ---------- effects layer over the board ---------- */
.board-wrap{position:relative}
.fxl{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden;border-radius:1.2cqw}
.fxl>*{pointer-events:auto}
.fxl>.rb,.fxl>.toast,.fxl>.confetti{pointer-events:none}
.mwrap{position:absolute;inset:0;display:grid;place-items:center;cursor:pointer}
.mwrap.out,.toast.out,.scene.out{animation:fadeout .25s forwards}
@keyframes fadeout{to{opacity:0}}
.mcard{position:relative;width:min(70%,520px);background:var(--ink);color:var(--tile-ink);border-radius:2cqw;padding:2.4cqw 3cqw 2.8cqw;text-align:center;
  box-shadow:0 2cqw 6cqw rgba(0,0,0,.55);border-top:1.4cqw solid var(--pk)}
.mcard .chip{display:inline-block;font-family:var(--display);font-size:1.8cqw;letter-spacing:.1em;background:var(--pk);color:#fff;border-radius:1cqw;padding:.3cqw 1.4cqw}
.mcard .who{font-size:9cqw;line-height:1.1;margin-top:1cqw}
.mcard .line{font-family:var(--display);font-weight:600;font-size:3.6cqw;line-height:1.25;margin-top:.8cqw;text-wrap:balance}
.mcard .fact{font-size:1.9cqw;opacity:.65;margin-top:.8cqw}
.pop{animation:punch .5s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes punch{0%{transform:scale(1.7);opacity:0}45%{transform:scale(.94);opacity:1}75%{transform:scale(1.03)}100%{transform:scale(1)}}
.spot{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,transparent 0 24%,rgba(6,7,24,.85) 50%);animation:spotin .45s both}
@keyframes spotin{from{opacity:0;transform:scale(1.6)}to{opacity:1;transform:scale(1)}}
.flashw,.flashr{position:absolute;inset:0;animation:flash .5s both}
.flashw{background:#fff}.flashr{background:#9b5cff}
@keyframes flash{0%{opacity:.85}30%{opacity:0}45%{opacity:.5}100%{opacity:0}}
.pk-hor .mcard{animation:punch .5s cubic-bezier(.2,.9,.3,1.25) both,jitter .12s .5s 4}
@keyframes jitter{50%{transform:translate(.4cqw,-.3cqw) rotate(-.6deg)}}
.ticker{position:absolute;left:11.4%;right:11.4%;bottom:13%;display:flex;background:#c8102e;color:#fff;font-family:var(--display);font-size:2.2cqw;overflow:hidden;white-space:nowrap}
.ticker b{background:#fff;color:#c8102e;padding:.5cqw 1.6cqw;z-index:1}
.ticker span{padding:.5cqw 0;animation:tick 2.4s linear both}
@keyframes tick{from{transform:translateX(70cqw)}to{transform:translateX(-10cqw)}}
.toast{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);display:flex;align-items:center;gap:1cqw;max-width:72%;
  background:var(--ink);color:var(--tile-ink);border-radius:999px;padding:1cqw 2.4cqw;font-family:var(--display);font-size:2.2cqw;
  box-shadow:0 1cqw 3cqw rgba(0,0,0,.45);border:.4cqw solid var(--pk);animation:toastin .35s cubic-bezier(.2,.9,.3,1.3) both}
.toast .te{font-size:3cqw}
@keyframes toastin{from{transform:translate(-50%,3cqw);opacity:0}}
.deed{position:relative;width:min(44%,300px);background:#fffdf4;color:var(--tile-ink);border-radius:1.2cqw;padding:3.2cqw 2cqw 2cqw;text-align:center;

/* Controller side: choose a line without repeating the last few, then broadcast it */
function pickIdx(ev) {
  const pool = MEMES.map((m, i) => m.ev === ev ? i : -1).filter(i => i >= 0);
  if (!pool.length) return -1;
  S.recent = S.recent || {};
  const rec = S.recent[ev] || [], keep = Math.min(5, pool.length - 1);
  const cand = pool.filter(i => !rec.slice(-keep).includes(i));
  const i = cand[Math.floor(Math.random() * cand.length)];
  S.recent[ev] = [...rec, i].slice(-5);
  return i;
}

  if (p.money < amt) { bankrupt(p, to); return; }
  p.money -= amt; if (to) to.money += amt;
  if (!info.silent) fx('pay', {from:p.id, to:to ? to.id : null, amt, i:info.i, big:!!info.big});
  if (p.money < 1000 && before >= 1000) meme('broke', {who:p.id});
}
function raiseFunds(p, need) {
  const mine = ownedBy(p).sort((a, b) => TILES[b].price - TILES[a].price);
  let sold = true;
  while (p.money < need && sold) {
    sold = false;
    for (const i of mine) if (p.money < need && canSell(p, i)) { sell(p, i); sold = true; }
  }
  for (const i of mine) if (p.money < need && canMortgage(p, i)) mortgage(p, i);
}
function bankrupt(p, to) {
  meme('bankrupt', {who:p.id});
  log(`💥 ${p.name} ล้มละลาย! ${to ? 'ทรัพย์สินทั้งหมดตกเป็นของ ' + to.name : 'ทรัพย์สินคืนธนาคาร'}`);
  for (const i of ownedBy(p)) {
    S.houses[i] = 0;
    if (to) S.owner[i] = to.id; else { delete S.owner[i]; S.mort[i] = false; }
  }
  if (to) { to.money += Math.max(0, p.money); to.cards += p.cards; to.jc = [...(to.jc || []), ...(p.jc || [])]; }
  p.money = 0; p.cards = 0; p.jc = []; p.out = true; p.jail = false;
  if (alive().length <= 1) finish(alive()[0], 'เป็นคนสุดท้ายที่ยังไม่ล้มละลาย');
}
function finish(winner, why) {
  S.over = {id:winner.id, why}; meme('win', {who:winner.id});
  log(`🏆 ${winner.name} คือเศรษฐีบางกอกตัวจริง!`);
}

/* ================= TURN FLOW ================= */
function ask(kind, data) {
  return new Promise(res => { S.pending = {kind, ...data}; pendingResolve = res; render(); });
}
function answer(v) { const r = pendingResolve; pendingResolve = null; S.pending = null; r && r(v); }

async function animDice(d) {
  const els = document.querySelectorAll('.die');
  if (!lowMo()) {
    els.forEach(e => e.classList.add('roll'));
    for (let k = 0; k < (CFG.fast ? 3 : 7); k++) { els[0].textContent = r6(); els[1].textContent = r6(); await sleep(55); }
    els.forEach(e => e.classList.remove('roll'));
  }
  S.dice = d;
}
async function step(p, dir) {
  p.pos = (p.pos + dir + 40) % 40;
  play('step');
  if (dir > 0 && p.pos === 0) { p.money += SALARY; fx('coin', {p:p.id, amt:SALARY}); log(`${p.name} ผ่านจุดเริ่มต้น เงินเดือนออก +${fmt(SALARY)}`); }
  render(); await sleep(spd(110));
}
async function moveBy(p, n) { const d = Math.sign(n); for (let k = 0; k < Math.abs(n); k++) await step(p, d); }
async function moveTo(p, target) { while (p.pos !== target) await step(p, 1); }
function sendJail(p) { fx('jail', {p:p.id}); meme('jail', {who:p.id}); p.pos = JAIL; p.jail = true; p.jailTurns = 0; S.doubles = 0; }

async function doRoll() {
  if (busy || S.over || S.phase !== 'roll') return;
  busy = true; S.card = null; render();
  const p = cur(), d = [r6(), r6()], dbl = d[0] === d[1], sum = d[0] + d[1];
  fx('dice'); await animDice(d);
  if (!lowMo() && !CFG.fast) { document.querySelectorAll('.die').forEach(e => e.classList.add('bounce')); await sleep(260); }
  log(`${p.name} ทอยได้ ${d[0]} + ${d[1]} = ${sum}${dbl ? ' (ดับเบิ้ล!)' : ''}`);
  if (p.jail) {
    if (dbl) { p.jail = false; log(`${p.name} ดับเบิ้ล! รถเริ่มขยับ หลุดจากแยกอโศก`); meme('escape', {who:p.id}); }
    else if (++p.jailTurns >= 3) { log(`${p.name} ติดครบ 3 ตา ต้องจ้างวินซิ่งออก ${fmt(JAIL_FINE)}`); await pay(p, JAIL_FINE, null); if (!p.out) p.jail = false; }
    else log(`${p.name} ยังติดแยกอโศก (${p.jailTurns}/3)`);
    if (!p.jail && !p.out) { await moveBy(p, sum); await landOn(p, sum); }
    S.phase = 'end';
  } else {
    if (dbl && ++S.doubles >= 3) {
      log(`${p.name} ดับเบิ้ล 3 ครั้งติด ขับเร็วเกิน! โดนจับไปแยกอโศก`); sendJail(p); S.phase = 'end';
    } else {
      await moveBy(p, sum); await landOn(p, sum);
      S.phase = dbl && !p.jail && !p.out ? 'roll' : 'end';
      if (S.phase === 'roll' && !S.over) log(`${p.name} ได้ดับเบิ้ล ทอยอีกรอบ!`);
    }
  }
  busy = false; render();
}

async function landOn(p, sum, opt = {}) {
  const i = p.pos, t = TILES[i];
  fx('land', {i});
  const risky = j => { const o = S.owner[j]; return o != null && o !== p.id && !S.mort[j] && hcount(j) > 0; };
  const nearMiss = !(isOwnable(t) && S.owner[i] != null && S.owner[i] !== p.id) && (risky((i + 1) % 40) || risky((i + 39) % 40));
  if (nearMiss && !['gojail', 'chance', 'chest'].includes(t.type)) meme('nearMiss', {who:p.id});
  if (isOwnable(t)) {
    const o = S.owner[i];
    if (o == null) {
      if (p.money < t.price) { log(`${p.name} เงินไม่พอซื้อ ${t.name}`); return; }
      const yes = p.bot ? botWantsBuy(p, i) : await ask('buy', {i});
      if (yes) {
        p.money -= t.price; S.owner[i] = p.id; fx('buy', {i, p:p.id, mi:pickIdx('buy')}); log(`${p.name} ซื้อ ${t.name} ราคา ${fmt(t.price)}`);
        if (t.type === 'prop' && hasGroup(p, t.g)) { log(`🎉 ${p.name} ได้ครบทั้งสี! ค่าเช่าคูณสอง สร้างคอนโดได้แล้ว`); meme('monopoly', {who:p.id, tile:i}); }
      }
      else log(`${p.name} ผ่าน ไม่ซื้อ ${t.name}`);
    } else if (o !== p.id) {
      if (S.mort[i]) { log(`${t.name} ติดจำนองอยู่ ${p.name} ไม่ต้องจ่าย`); return; }
      const owner = S.players[o]; let rent = opt.util10 && t.type === 'util' ? sum * 100 : rentOf(i, sum); if (opt.double) rent *= 2;
      log(`${p.name} จ่ายค่าเช่า ${t.name} ให้ ${owner.name} ${fmt(rent)}`);
      const big = rent >= 2000 || rent >= p.money * .4;
      await pay(p, rent, owner, {i, big});
      if (!p.out) meme(big ? 'rentBig' : 'rentGet', big ? {who:p.id, amt:rent, tile:i, fact:`จ่ายค่าเช่า ${fmt(rent)} ให้ ${owner.name}`} : {who:o, amt:rent});
    }
  } else if (t.type === 'tax') { log(`${p.name} ${t.name} จ่าย ${fmt(t.amt)}`); await pay(p, t.amt, null, {silent:true}); if (!p.out) fx('tax', {p:p.id, amt:t.amt, i, mi:pickIdx('tax')}); }
  else if (t.type === 'chance' || t.type === 'chest') await drawCard(p, t.type, sum);
  else if (t.type === 'gojail') { log(`${p.name} ฝนตกรถติด! ไปติดแยกอโศก`); sendJail(p); }
  else if (t.type === 'free') log(`${p.name} หาที่จอดในสยามได้! ปาฏิหาริย์ชัดๆ`);
}

async function drawCard(p, deck, sum) {
  const list = DECKS[deck].list();
  if (S.decks[deck].length !== list.length) S.decks[deck] = shuffle([...list.keys()]);   // deck grew (older save)
  let ci, c, guard = 0;
  do { ci = S.decks[deck][S.di[deck]++ % list.length]; c = list[ci]; }
  while (c.k === 'card' && heldCards().includes(deck) && ++guard < list.length);
  if (S.di[deck] % list.length === 0) log(`สับการ์ด${DECKS[deck].name}ใหม่`);
  S.card = {deck, ci};
  fx('card', {deck, ci, p:p.id});
  log(`${p.name} 「${DECKS[deck].name}」 ${c.t}`);
  render(); await sleep(spd(1500));
  switch (c.k) {
    case 'money': if (c.v > 0) { p.money += c.v; fx('coin', {p:p.id, amt:c.v}); } else await pay(p, -c.v, null); break;
    case 'each':
      for (const q of alive()) if (q !== p && !p.out) {
        if (c.v > 0) await pay(q, c.v, p); else await pay(p, -c.v, q);
      } break;
    case 'to': await moveTo(p, c.v); await landOn(p, sum); break;
    case 'back': await moveBy(p, -c.v); await landOn(p, sum); break;
    case 'rail': { let k = p.pos; do k = (k + 1) % 40; while (TILES[k].type !== 'rail');
      await moveTo(p, k); await landOn(p, sum, {double:true}); break; }
    case 'util': { let k = p.pos; do k = (k + 1) % 40; while (TILES[k].type !== 'util');
      await moveTo(p, k);
      if (S.owner[k] != null && S.owner[k] !== p.id && !S.mort[k]) {
        const d = [r6(), r6()]; S.dice = d; fx('dice'); log(`${p.name} ทอยเต๋าคิดค่าไฟ ได้ ${d[0] + d[1]}`);
        await landOn(p, d[0] + d[1], {util10:true});
      } else await landOn(p, sum);
      break; }
    case 'jail': sendJail(p); break;
    case 'card': p.cards++; p.jc = [...(p.jc || []), deck]; break;
    case 'repair': { let cost = 0; for (const i of ownedBy(p)) { const h = hcount(i); cost += h === 5 ? c.v[1] : h * c.v[0]; }
      if (cost) { log(`${p.name} ค่าซ่อมรวม ${fmt(cost)}`); await pay(p, cost, null); } else log(`${p.name} ยังไม่มีสิ่งปลูกสร้าง ไม่ต้องจ่าย`); break; }
  }
}

function payJail(useCard) {
  const p = cur(); if (!p.jail || busy) return;
  if (useCard && !p.cards) return;
  if (useCard) { p.cards--; const d = (p.jc || []).pop(); log(`ตั๋วช้างกลับเข้ากอง${d ? DECKS[d].name : ''}`); log(`${p.name} ยื่นตั๋วช้าง ออกจากแยกอโศกสบายๆ`); }
  else { p.money -= JAIL_FINE; fx('pay', {from:p.id, amt:JAIL_FINE}); log(`${p.name} จ้างวินซิ่งฝ่ารถติดออกมา ${fmt(JAIL_FINE)}`); }
  p.jail = false; p.jailTurns = 0; render();
}
function endTurn() {
  if (busy || S.over) return;
  S.doubles = 0; S.card = null;
  let n = S.turn;
  do n = (n + 1) % S.players.length; while (S.players[n].out);
  if (n <= S.turn) S.round++;
  if (S.maxRounds && S.round > S.maxRounds) {
    S.round = S.maxRounds;
    const best = alive().slice().sort((a, b) => netWorth(b) - netWorth(a))[0];
    finish(best, `ทรัพย์สินรวมมากที่สุดเมื่อครบ ${S.maxRounds} รอบ (${fmt(netWorth(best))})`);
  }
  S.turn = n; S.phase = 'roll'; confirmEnd = false;
  if (!online() && !cur().bot && !S.over) play('turn');
  render();
}
function endGameByWorth() {
  if (!confirmEnd) { confirmEnd = true; render(); return; }
  const best = alive().slice().sort((a, b) => netWorth(b) - netWorth(a))[0];
  finish(best, `ทรัพย์สินรวมมากที่สุด (${fmt(netWorth(best))})`); render();
}

/* ================= BOTS ================= */
function botWantsBuy(p, i) { return p.money - TILES[i].price >= 1500; }
function botManage(p) {
  for (const i of ownedBy(p)) if (S.mort[i] && p.money - unmortCost(i) > 6000) unmortgage(p, i);
  let built = true;
  while (built) {
    built = false;
    for (const i of ownedBy(p).sort((a, b) => hcount(a) - hcount(b)))
      if (canBuild(p, i) && p.money - GROUPS[TILES[i].g].h >= 3000) { build(p, i); built = true; break; }
  }
}
function scheduleBot() {
  if (botTimer || !S || S.over || busy || !runsBots() || NET.applying) return;
  if (!cur().bot) return;
  botTimer = setTimeout(async () => {
    botTimer = null; if (busy || S.over || !cur().bot || !runsBots()) return;
    const p = cur();
    if (S.phase === 'roll') {
      if (p.jail && p.cards) payJail(true);
      else if (p.jail && p.money > 6000) payJail(false);
      await doRoll();
    } else { botManage(p); render(); await sleep(400); endTurn(); }
  }, CFG.fast || lowMo() ? 250 : 750);
}

function renderInfo() {
  const box = $('infoBody');

    await NET.db.doc('games/' + code).set({status:'lobby', host:NET.me, seats:[me], rounds:30, created:Date.now(), updated:Date.now(), v:0});

async function joinRoom(code) {
  code = (code || '').toUpperCase().trim();
  if (!/^[A-Z0-9]{4}$/.test(code)) { oerr('รหัสห้องต้องมี 4 ตัวอักษร'); return; }
  const me = onlineProfile();
  try {
    const snap = await NET.db.doc('games/' + code).get();
    if (!snap.exists) { oerr('ไม่พบห้อง ' + code); return; }
    const d = snap.data();
    if (d.status === 'lobby') {
      NET.ref = NET.db.doc('games/' + code);
      await editLobby(x => {
        if (!x || x.status !== 'lobby') return null;
        const mine = x.seats.find(s => s.uid === NET.me);
        if (mine) { mine.name = me.name; mine.tok = me.tok; return x; }
        if (x.seats.length >= 4) throw new Error('ห้องเต็มแล้ว');
        if (x.seats.some(s => s.tok === me.tok)) me.tok = TOKENS.find(t => !x.seats.some(s => s.tok === t));
        x.seats.push(me); return x;
      });

    NET.err = ''; connect(code);   // a game in progress opens as a seat you hold, or to watch
  } catch (e) { oerr(e.message || String(e)); }
}

async function lobbyAction(act, b) {
  try {
    if (act === 'addbot') await editLobby(x => {
      if (x.seats.length >= 4) return null;
      const name = BOT_NAMES.find(n => !x.seats.some(s => s.name === n)) || 'บอท';

    });
    if (act === 'kick') await editLobby(x => { x.seats.splice(+b.dataset.i, 1); return x; });
    if (act === 'rounds') await editLobby(x => { x.rounds = +$('lrounds').value; return x; });
    if (act === 'startonline') await editLobby(x => {
      if (!x || x.status !== 'lobby' || x.seats.length < 2) return null;
      NET.lastV = 1;
      newGame(x.seats, x.rounds, NET.me);
      NET.lastJson = JSON.stringify(S); NET.lastFx = S.fxn;

let saveTimer = null;
function autosave() {
  if (!S || online() || S.preview || busy || saveTimer) return;
  saveTimer = setTimeout(() => {
    saveTimer = null;
    if (!S || online() || S.preview) return;
    if (S.over) { try { localStorage.removeItem('bkk-save'); } catch (e) {} return; }
    lsSet('bkk-save', JSON.stringify({...S, pending:null, saved:Date.now()}));
  }, 800);
}
function savedGame() {
  try { const g = JSON.parse(lsGet('bkk-save') || 'null'); return g && g.players && !g.over ? g : null; } catch (e) { return null; }
}
function resumeGame() {
  const g = savedGame(); if (!g) return;
  S = g; S.preview = false; busy = false; pendingResolve = null;
  if (S.phase !== 'roll' && S.phase !== 'end') S.phase = 'end';
  NET.lastFx = S.fxn || 0; winShown = '';
  $('ov').hidden = true; log('เล่นต่อจากที่บันทึกไว้'); render();
}

/* ================= EVENTS ================= */
document.addEventListener('click', e => {
  const tile = e.target.closest('.tile');
  if (tile) { sel = +tile.dataset.i === sel ? null : +tile.dataset.i; render(); return; }
  const ds = e.target.closest('[data-sel]');
  if (ds) { sel = +ds.dataset.sel; render(); $('info').scrollIntoView({block:'nearest', behavior:lowMo() ? 'auto' : 'smooth'}); return; }
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  audio();   // unlock sound on the first tap
  if (b.dataset.react) { sendReact(+b.dataset.react); return; }
  const act = b.dataset.act, m = b.dataset.m;
  if (b.dataset.tab) { showSetup(b.dataset.tab); return; }
  if (act === 'mute') { CFG.sound = !CFG.sound; saveCfg(); b.textContent = CFG.sound ? '🔊' : '🔇'; play('coin'); return; }
  if (act === 'settings') { showSettings(); return; }
  if (act === 'cfgclose') { $('sov').hidden = true; return; }
  if (act === 'cfgdemo') {
    $('sov').hidden = true;
    const evs = ['monopoly', 'rentBig', 'broke', 'jail'], ev = evs[Math.floor(Math.random() * evs.length)];
    const m = pickLine(ev, -1), who = S ? (mySeat() || cur()).id : 0;
    UI.lastMid = 0;
    if (m && S) stage({tier:'mid', dur:1800, el:() => memeCard(m, {who, amt:2400, tile:39}), onStart:() => { play(PACKS[m.pack].snd); if (m.pack === 'hor') shake(); }});
    return;
  }
  if (act === 'resume') { resumeGame(); return; }
  if (act === 'setup') { showSetup(); return; }
  if (act === 'close') { $('ov').hidden = true; return; }
  if (act === 'create') { createRoom(); return; }
  if (act === 'join') { joinRoom($('ocode').value); return; }
  if (act === 'joincode') { joinRoom(b.dataset.code); return; }
  if (act === 'rooms') { listRooms(); return; }
  if (act === 'leave') { leave(); return; }
  if (act === 'copy') {
    const done = () => { b.textContent = 'คัดลอกแล้ว'; };
    navigator.clipboard ? navigator.clipboard.writeText(NET.code).then(done, () => getSelection().selectAllChildren($('lcode'))) : getSelection().selectAllChildren($('lcode'));
    return;
  }
  if (['addbot', 'kick', 'startonline'].includes(act)) { lobbyAction(act, b); return; }
  if (!S) return;
  if (act !== 'worth') confirmEnd = false;
  if (act !== 'takeover') confirmTake = false;
  if (act === 'worth') { endGameByWorth(); return; }
  if (act !== 'debtgive') confirmGive = false;
  if (act === 'takeover') {
    if (!confirmTake) { confirmTake = true; render(); return; }
    confirmTake = false; cur().bot = true; log(`${cur().name} หลุดจากเกม ให้บอทเล่นแทน`); render(); return;
  }
  if (!myTurn()) return;
  if (act === 'debtpay') { if (S.pending && S.pending.kind === 'debt' && cur().money >= S.pending.amt) answer('pay'); return; }
  if (act === 'debtauto') { if (S.pending && S.pending.kind === 'debt') answer('auto'); return; }
  if (act === 'debtgive') {
    if (!confirmGive) { confirmGive = true; render(); return; }
    confirmGive = false; if (S.pending && S.pending.kind === 'debt') answer('give'); return;
  }
  if (act === 'roll') doRoll();
  else if (act === 'buy') answer(true);
  else if (act === 'pass') answer(false);
  else if (act === 'end') endTurn();
  else if (act === 'fine') payJail(false);
  else if (act === 'card') payJail(true);
  else if (m && ((!busy && !S.pending) || (S.pending && S.pending.kind === 'debt'))) {
    const p = cur(), i = +b.dataset.i, debt = !!S.pending;
    if (m === 'build' && !debt && canBuild(p, i)) build(p, i);
    if (m === 'sell' && canSell(p, i)) sell(p, i);
    if (m === 'mort' && canMortgage(p, i)) mortgage(p, i);
    if (m === 'unmort' && !debt && S.mort[i] && p.money >= unmortCost(i)) unmortgage(p, i);
    render();
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'lrounds') lobbyAction('rounds');
  if (e.target.form && e.target.form.id === 'cfgf') readSettings(e.target.form);
});
document.addEventListener('keydown', e => {
  const tile = e.target.closest && e.target.closest('.tile');
  if (tile && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); tile.click(); }
  if (e.target.id === 'ocode' && e.key === 'Enter') joinRoom(e.target.value);
});

/* Keep a running game across live page updates */
window.claude?.hot?.snapshot?.(() => NET.code ? {code:NET.code} : S ? {S: JSON.parse(JSON.stringify({...S, pending:null}))} : {});
function start(data) {
  document.body.classList.toggle('lowmo', lowMo());
  if (data && data.code) {
    resumeCode = data.code;
    newGame(DEFAULT_SLOTS.filter(s => s.on));
  } else if (data && data.S) {
    S = data.S;
    if (S.phase !== 'roll' && S.phase !== 'end') S.phase = 'end';
    render();
  } else {
    // Preview game behind the setup dialog
    newGame(DEFAULT_SLOTS.filter(s => s.on)); S.preview = true;
    showSetup();
  }
  initNet().then(() => { if (resumeCode && NET.db && NET.me) connect(resumeCode); });
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
