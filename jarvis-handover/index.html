<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jarvis ส่งเวร</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0e1524">
<meta name="description" content="พูดครั้งเดียว ทั้งกะรู้เรื่อง: ส่งเวร Front Office ด้วยเสียง สรุปด้วย AI ส่งเข้ากลุ่ม LINE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first handover board. A deep "night" summary card with gold progress on top,
   open items grouped by department as room tiles, glass night pill nav with a gold centre button
   that fans out quick actions.
   BRAND: change --gold / --gold-hi / --night here to match the hotel's brand guideline. */
:root{
  --gold:#b08a4f; --gold-hi:#dcc08d; --gold-ink:#8a6a35; --gold-soft:#f3ead9;
  --night:#0e1524; --night-2:#1b2438; --night-ink:#c9d0de;
  --bg:#f4f4f2; --card:#ffffff; --ink:#151821; --muted:#6c7280; --line:#e7e6e1;
  --red:#d9473b; --red-ink:#b42318; --red-soft:#fbeae8;
  --amber:#e08a00; --amber-ink:#a35f00; --amber-soft:#fdf1dc;
  --green:#1f9d7a; --green-soft:#e2f4ee;
  --scrim:rgba(14,21,36,.55); --shadow:0 1px 2px rgba(14,21,36,.04),0 8px 24px rgba(14,21,36,.06);
  --f-display:"Anuphan","IBM Plex Sans Thai Looped",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai Looped","Noto Sans Thai",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --gold:#c9a46a; --gold-hi:#e6cc9b; --gold-ink:#e0c28c; --gold-soft:#2e2718;
  --night:#121a2b; --night-2:#1f2a41; --night-ink:#c9d0de;
  --bg:#0a0d13; --card:#141922; --ink:#eef0f4; --muted:#8f97a6; --line:#242b37;
  --red:#ff6a5c; --red-ink:#ff8a7e; --red-soft:#3a1b18; --amber:#f5a524; --amber-ink:#f5b54a; --amber-soft:#35290f;
  --green:#3cc39c; --green-soft:#11322a; --scrim:rgba(0,0,0,.62); --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --gold:#c9a46a; --gold-hi:#e6cc9b; --gold-ink:#e0c28c; --gold-soft:#2e2718;
  --night:#121a2b; --night-2:#1f2a41; --night-ink:#c9d0de;
  --bg:#0a0d13; --card:#141922; --ink:#eef0f4; --muted:#8f97a6; --line:#242b37;
  --red:#ff6a5c; --red-ink:#ff8a7e; --red-soft:#3a1b18; --amber:#f5a524; --amber-ink:#f5b54a; --amber-soft:#35290f;
  --green:#3cc39c; --green-soft:#11322a; --scrim:rgba(0,0,0,.62); --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 160px}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.eyebrow{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sync{font-size:12px;padding:1px 9px;border-radius:99px;background:var(--line);color:var(--muted)}
.sync.cloud{background:var(--green-soft);color:var(--green)}
.top h1{font-size:32px;font-weight:700;line-height:1.15;letter-spacing:-.01em}
.top-act{display:flex;gap:10px;align-items:center}
.icon-btn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--ink)}
.icon-btn svg{width:22px;height:22px}
.orb{position:relative;width:62px;height:62px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 35%,var(--night-2),var(--night) 72%);
  box-shadow:0 0 0 2px var(--night),0 0 0 4px var(--gold),0 10px 28px rgba(176,138,79,.35)}
.orb svg{width:28px;height:28px;color:var(--gold-hi)}
.orb .dot{position:absolute;top:1px;right:1px;width:14px;height:14px;border-radius:50%;background:var(--red);border:2px solid var(--bg)}
.orb.live{animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 2px var(--night),0 0 0 9px var(--gold-hi),0 10px 40px rgba(220,192,141,.6)}}

/* status strip */
.status{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 18px;border-radius:24px;color:#fff;
  background:radial-gradient(120% 120% at 100% 0%,rgba(220,192,141,.2),transparent 55%),linear-gradient(160deg,var(--night-2),var(--night));box-shadow:0 10px 30px rgba(14,21,36,.22)}
.st-main{display:flex;align-items:baseline;gap:8px}
.st-main b{font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1}
.st-main span{color:var(--gold-hi);font-weight:600}
.st-chips{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.st-chip{font-size:13px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.1);color:var(--night-ink);white-space:nowrap}
.st-chip.hot{background:var(--red);color:#fff;font-weight:600}
.st-send{display:flex;align-items:center;gap:6px;padding:10px 16px;border-radius:99px;font-family:var(--f-display);font-weight:700;color:#1b1406;background:linear-gradient(135deg,var(--gold-hi),var(--gold))}
.st-send svg{width:17px;height:17px}

/* task list: one list, ordered by what to do first */
.group{margin-top:24px}
.group-h{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.group-h h2{font-size:19px;font-weight:700;display:flex;align-items:center;gap:8px}
.group-h .cnt{font-family:var(--f-display);font-size:13px;font-weight:700;min-width:24px;height:24px;padding:0 7px;border-radius:99px;display:inline-grid;place-items:center;background:var(--line);color:var(--ink)}
.group.now .cnt{background:var(--red);color:#fff}
.group.timed .cnt{background:var(--amber);color:#1b1406}
.group-h p{margin:0;color:var(--muted);font-size:13px}
.tasks{display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;position:relative}
.task::before{content:"";width:4px;flex:none;background:var(--line)}
.task.now::before{background:var(--red)} .task.timed::before{background:var(--amber)} .task.follow::before{background:var(--gold)} .task.info::before{background:var(--green)}
.task.done{opacity:.6;box-shadow:none}
.check{flex:none;width:54px;display:grid;place-items:center}
.check svg{width:30px;height:30px;padding:5px;border-radius:50%;border:2px solid var(--line);color:transparent;transition:all .15s}
.check:hover svg{border-color:var(--gold);color:var(--gold)}
.task.done .check svg{background:var(--green);border-color:var(--green);color:#fff}
.tb{flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;text-align:left;padding:12px 14px 12px 0}
.t-who{grid-column:1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.t-room{font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:0 8px}
.t-vip{font-size:11.5px;font-weight:700;color:var(--gold-ink);background:var(--gold-soft);border-radius:6px;padding:1px 6px}
.t-do{grid-column:1;font-size:16px;font-weight:600;line-height:1.4;color:var(--ink)}
.t-why{grid-column:1;font-size:13.5px;color:var(--muted);line-height:1.4}
.task.done .t-do{text-decoration:line-through;text-decoration-color:var(--muted)}
.t-time{grid-column:2;grid-row:1 / span 3;align-self:center;text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.t-time b{font-family:var(--f-display);font-size:20px;line-height:1.1}
.t-time small{font-size:12px;color:var(--muted);white-space:nowrap}
.t-time.late b,.t-time.late small{color:var(--red-ink)}
.t-time.soon small{color:var(--amber-ink);font-weight:600}
details.donebox{margin-top:24px}
details.donebox summary{cursor:pointer;list-style:none;font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--muted);display:flex;align-items:center;gap:8px}
details.donebox summary::-webkit-details-marker{display:none}
details.donebox summary::after{content:"แสดง";font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--gold-ink)}
details.donebox[open] summary::after{content:"ซ่อน"}
details.donebox .tasks{margin-top:10px}
.empty{color:var(--muted);text-align:center;padding:34px 10px}
.empty b{display:block;font-family:var(--f-display);font-size:20px;color:var(--ink);margin-bottom:4px}
.exbar{margin-top:14px;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.exbar button{color:var(--gold-ink);font-weight:600}

/* login */
body.locked .nav{display:none}
.login{min-height:calc(100vh - 60px);display:flex;flex-direction:column;justify-content:center;gap:24px;max-width:420px;margin:0 auto;padding-block:24px}
.login-brand{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.login-brand .orb{width:76px;height:76px}
.login-brand .orb svg{width:34px;height:34px}
.login-brand h1{font-size:30px}
.login-brand p{margin:0;color:var(--muted)}
.form{display:flex;flex-direction:column;gap:14px}
.login-card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow)}
.pw{position:relative}
.pw input{padding-right:70px}
.pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:13px;font-weight:600;color:var(--gold-ink);padding:6px 8px}
.link{color:var(--gold-ink);font-weight:600;font-size:14px;align-self:center;padding:4px}
input[type=email]{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 15px}

/* bell + inbox */
.top-act{display:flex;gap:10px;align-items:center}
.icon-btn{position:relative;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--ink)}
.icon-btn svg{width:22px;height:22px}
.badge{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--red);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)}
.noti{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.noti.new{border-color:var(--green);background:color-mix(in srgb,var(--green-soft) 55%,var(--card))}
.noti-ic svg{width:28px;height:28px;padding:5px;border-radius:50%;background:var(--green);color:#fff}
.noti-t{display:flex;flex-direction:column;min-width:0;font-size:14px}
.noti-t b{font-family:var(--f-display);font-size:16px}
.noti-t small{color:var(--muted);font-size:12.5px;margin-top:2px}

/* account + team */
.acct{gap:12px}
.acct-row{display:flex;gap:12px;align-items:center}
.avatar{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:18px;color:#1b1406;background:linear-gradient(135deg,var(--gold-hi),var(--gold))}
.team{display:flex;flex-direction:column;gap:8px}
.member{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.member.off{opacity:.5}
.m-t{flex:1;min-width:0;display:flex;flex-direction:column}
.m-t small{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.pw-inline{display:flex;gap:8px;width:100%}
.pw-inline input{flex:1;padding:9px 12px}
.switch{display:flex;align-items:center;gap:10px;font-size:15px}
.switch input{width:20px;height:20px;accent-color:var(--gold)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;pointer-events:none;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav-in{max-width:600px;margin:0 auto;height:76px;border-radius:38px;display:grid;grid-template-columns:1fr 112px 1fr;align-items:center;pointer-events:auto;
  background:color-mix(in srgb,var(--night) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 12px 32px rgba(14,21,36,.3)}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;color:#8d97ab;font-family:var(--f-display);font-weight:600;font-size:14px}
.nav-btn.on{color:var(--gold-hi)}
.nav-btn svg{width:25px;height:25px}
.fab{justify-self:center;width:94px;height:94px;margin-top:-36px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  font-family:var(--f-display);font-weight:700;font-size:14px;color:#1b1406;border:6px solid var(--bg);
  background:linear-gradient(145deg,var(--gold-hi),var(--gold));box-shadow:0 10px 26px rgba(176,138,79,.45);transition:transform .15s}
.fab:active{transform:scale(.95)}
.fab svg{width:30px;height:30px}
.fab.open{background:#fff;color:var(--night)}

/* radial */
.scrim{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:20}
.radial{position:fixed;left:50%;bottom:calc(118px + env(safe-area-inset-bottom,0px));width:350px;max-width:calc(100% - 24px);height:290px;transform:translateX(-50%);z-index:25}
.rb{position:absolute;display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;font-family:var(--f-display);font-weight:600;font-size:14.5px;width:112px;margin-left:-56px;animation:pop .24s cubic-bezier(.2,.9,.3,1.3) both;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.rb .c{width:66px;height:66px;border-radius:50%;background:#fff;color:var(--night);display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.rb.main .c{width:86px;height:86px;color:#1b1406;background:linear-gradient(145deg,var(--gold-hi),var(--gold))}
.rb svg{width:27px;height:27px}
.rb.main svg{width:34px;height:34px}
@keyframes pop{from{opacity:0;transform:translateY(34px) scale(.5)}}

/* sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;max-height:92%;overflow:auto;overscroll-behavior:contain;background:var(--bg);border-radius:28px 28px 0 0;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  box-shadow:0 -12px 40px rgba(0,0,0,.25);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet-in{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sheet-top{position:sticky;top:-8px;z-index:2;display:flex;justify-content:center;align-items:center;min-height:40px;margin:0 0 -6px;background:var(--bg)}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line)}
.sheet-x{position:absolute;right:0;top:4px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.sheet-x svg{width:18px;height:18px}
.sheet h3{font-size:22px;font-weight:700}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>.btn{align-self:stretch}
.mic-zone{display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 0}
.mic-zone .orb{width:110px;height:110px}
.mic-zone .orb svg{width:44px;height:44px}
.wave{display:flex;gap:4px;height:22px;align-items:center}
.wave i{width:4px;border-radius:4px;background:var(--gold);height:6px}
.live-wave .wave i{animation:wv 0.9s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}
@keyframes wv{50%{height:22px}}
.hint{color:var(--muted);font-size:13.5px;text-align:center;max-width:44ch}
label.lab{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
textarea,input[type=text],input[type=time],input[type=password],select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 15px}
textarea{min-height:140px;resize:vertical}
.partial{color:var(--gold-ink);font-style:italic;min-height:1.5em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 16px;border-radius:16px;font-weight:700;font-family:var(--f-display);font-size:15.5px;flex:1;text-decoration:none;color:inherit}
.btn.pri{color:#1b1406;background:linear-gradient(135deg,var(--gold-hi),var(--gold))}
.btn.dark{background:var(--night);color:#fff}
.btn.sec{background:var(--card);border:1px solid var(--line)}
.btn.line{background:#06c755;color:#fff}
.btn.danger{color:var(--red-ink);background:var(--red-soft)}
.btn[disabled]{opacity:.5;cursor:default}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13.5px}
.chip.on.urgent{background:var(--red);border-color:var(--red);color:#fff}
.chip.on.follow{background:var(--amber);border-color:var(--amber);color:#1b1406}
.chip.on.info{background:var(--green);border-color:var(--green);color:#fff}
.item{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 14px 14px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:start}
.item .rm{font-family:var(--f-display);font-weight:700;font-size:20px;min-width:50px}
.item .tx{min-width:0}
.item .tx p{margin:0}
.item .act{color:var(--muted);font-size:14px}
.item .x{color:var(--muted);font-size:22px;line-height:1;padding:2px 6px}
.tag{font-size:12px;font-weight:600;padding:1px 9px;border-radius:99px;margin-right:6px;white-space:nowrap}
.tag.urgent{background:var(--red-soft);color:var(--red-ink)} .tag.follow{background:var(--amber-soft);color:var(--amber-ink)} .tag.info{background:var(--green-soft);color:var(--green)}
.tag.ex{background:var(--gold-soft);color:var(--gold-ink)}
pre.brief{white-space:pre-wrap;word-break:break-word;margin:0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;font-family:var(--f-body);font-size:14px;max-height:44vh;overflow:auto}
.note{font-size:13px;color:var(--muted);margin:0}
.err{font-size:13.5px;color:var(--red-ink);margin:0}
.toast{position:fixed;left:50%;bottom:calc(108px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--night);color:#fff;padding:10px 18px;border-radius:99px;z-index:60;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px);text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}

.toast{display:flex;align-items:center;gap:14px;white-space:nowrap}
.toast-undo{color:var(--gold-hi);font-weight:700;font-size:14px}

/* Jarvis chat */
.sheet.chat{height:90%}
.sheet.chat .sheet-in{min-height:100%}
.jv-head{display:flex;gap:12px;align-items:center}
.orb.sm{width:44px;height:44px}
.orb.sm svg{width:20px;height:20px}
.chat{flex:1;display:flex;flex-direction:column;gap:10px;padding-bottom:6px}
.bubble{max-width:88%;padding:11px 14px;border-radius:20px;font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.bubble ul{margin:6px 0 0;padding-left:1.1em;color:var(--muted)}
.bubble.me{align-self:flex-end;background:var(--night);color:#fff;border-bottom-right-radius:6px}
.bubble.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px;display:flex;flex-direction:column;gap:8px}
.act{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--bg);font-size:13.5px}
.act-ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;background:var(--gold-soft);color:var(--gold-ink)}
.act.close .act-ic{background:var(--green-soft);color:var(--green)}
.act.delete .act-ic,.act.miss .act-ic{background:var(--red-soft);color:var(--red-ink)}
.act-t{flex:1;min-width:0}
.mini{flex:none;font-size:13px;font-weight:600;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--card)}
.mini.gold{border:0;color:#1b1406;background:linear-gradient(135deg,var(--gold-hi),var(--gold))}
.dots{display:inline-flex;gap:4px;padding:4px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:dt 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dt{50%{opacity:.25;transform:translateY(-3px)}}
.dock{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:8px calc(24px + env(safe-area-inset-bottom,0px));margin-bottom:calc(-24px - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.suggest{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.suggest::-webkit-scrollbar{display:none}
.suggest .chip{flex:none}
.composer{display:flex;gap:8px;align-items:flex-end;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:6px}
.composer textarea{border:0;background:none;min-height:0;padding:10px 4px;resize:none;border-radius:0;outline:none;line-height:1.4}
.mic-btn,.send-btn{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.mic-btn{background:var(--night);color:var(--gold-hi)}
.mic-btn.live{background:var(--red);color:#fff;animation:pulse2 1.2s infinite}
@keyframes pulse2{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--red) 30%,transparent)}}
.send-btn{color:#1b1406;background:linear-gradient(135deg,var(--gold-hi),var(--gold))}
.mic-btn svg,.send-btn svg{width:22px;height:22px}

/* briefs */
.hist{display:flex;flex-direction:column;gap:12px}
.bcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.bmeta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.bhead{font-family:var(--f-display);font-weight:700;font-size:17px}
.acks{display:flex;gap:6px;flex-wrap:wrap}
.ack{font-size:12.5px;padding:3px 10px;border-radius:99px;background:var(--green-soft);color:var(--green);font-weight:600}
.ack.wait{background:var(--amber-soft);color:var(--amber-ink)}
details.more summary{cursor:pointer;color:var(--gold-ink);font-size:13.5px;font-weight:600}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <!-- LOGIN -->
  <section id="v-login" class="login" hidden>
    <div class="login-brand">
      <span class="orb" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>
      <h1>Jarvis ส่งเวร</h1>

    <header class="top">

        <h1>งานที่ต้องทำต่อ</h1>
      </div>
      <div class="top-act">
      <button class="icon-btn bell" id="bellBtn" aria-label="แจ้งเตือน" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
        <span class="badge num" id="bellBadge" hidden>0</span>
      </button>
      <button class="orb" id="orbHome" aria-label="คุยกับ Jarvis">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        <span class="dot" id="orbDot" hidden></span>
      </button>
      </div>
    </header>

    <div class="status" id="status">
      <div class="st-main"><b class="num" id="stOpen">0</b><span>งานค้าง</span></div>
      <div class="st-chips" id="stChips"></div>
      <button class="st-send" id="sendAll">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        สรุปส่งไลน์
      </button>
    </div>

    <div id="sections"></div>
  </section>

  <!-- BRIEFS -->
  <section id="v-briefs" hidden>
    <header class="top"><div><div class="eyebrow">ใครรับเวรแล้วบ้าง</div><h1>สรุปที่ส่งไลน์</h1></div></header>
    <div class="hist" id="hist"></div>
  </section>

</div>

<nav class="nav" aria-label="เมนูหลัก">
  <div class="nav-in">
    <button class="nav-btn" data-view="briefs" id="navBriefs">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10v18l-2.5-1.5L12 21l-2.5-1.5L7 21z"/><path d="M10 8h4M10 12h4"/></svg>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" id="fabIco"><path d="M4 10.5 12 4l8 6.5V20h-5v-5h-6v5H4z"/></svg>

</nav>

<div class="scrim" id="scrim" hidden></div>
<div class="radial" id="radial" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"><div class="sheet-in" id="sheetIn"></div></div>
<div class="toast" id="toast" hidden role="status"></div>

<script src="config.js" onerror="void 0"></script>
<script>
(() => {
"use strict";
const CFG = Object.assign({ teamId: "fo", firebase: null }, window.JARVIS_CONFIG || {});

const CATS = [
  { id: "vip", name: "VIP & Arrival" },
  { id: "room", name: "ห้องพัก / Housekeeping" },
  { id: "complaint", name: "Complaint" },
  { id: "maint", name: "ซ่อมบำรุง" },
  { id: "billing", name: "Billing / Cashier" },
  { id: "lost", name: "Lost & Found" },
  { id: "other", name: "อื่น ๆ" },
];
const CAT_NAME = Object.fromEntries(CATS.map(c => [c.id, c.name]));
const PRI = { urgent: "ด่วน", follow: "ติดตาม", info: "แจ้งทราบ" };
const PRI_ICON = { urgent: "🔴", follow: "🟡", info: "🟢" };
const ORDER = { urgent: 0, follow: 1, info: 2 };

const EXAMPLES = [
  { room: "1208", guest: "คุณ T. (VIP)", cat: "vip", pri: "urgent", summary: "VIP ใกล้มาถึง ขอ welcome amenity แบบไม่มีถั่ว", action: "ยืนยันกับ F&B และ HK ว่า amenity เข้าห้องก่อนแขกถึง", due: "15:00" },
  { room: "915", guest: "คุณ S.", cat: "complaint", pri: "urgent", summary: "แอร์ไม่เย็น แขกโทรมา 2 ครั้ง ไม่พอใจ", action: "ตามช่างอีกรอบ ถ้ายังไม่เสร็จเสนอย้ายห้อง", due: "14:30" },
  { room: "1502", guest: "คุณ M.", cat: "room", pri: "follow", summary: "ขอ late check-out 16:00 อนุมัติแล้ว", action: "แจ้ง HK เลื่อนทำห้อง", due: "" },
  { room: "712", guest: "", cat: "maint", pri: "follow", summary: "ฝักบัวน้ำรั่ว ช่างรับเรื่องแล้ว", action: "เช็กสถานะก่อนขายห้องคืน", due: "18:00" },
  { room: "1104", guest: "คุณ K.", cat: "billing", pri: "follow", summary: "มัดจำบัตรยังไม่ผ่าน", action: "ขอบัตรใบใหม่หรือเงินสดตอนแขกกลับเข้าห้อง", due: "" },
  { room: "—", guest: "", cat: "lost", pri: "info", summary: "พบแว่นกันแดดที่ล็อบบี้ เก็บไว้ที่ Concierge", action: "", due: "" },
  { room: "803", guest: "คุณ P. (VIP)", cat: "vip", pri: "info", summary: "ครบรอบแต่งงาน จัดเค้กแล้ว", action: "", due: "" },
].map((x, i) => {
  const mine = [0, 1, 6].includes(i); // reported by the shift leader in the demo
  return { ...x, id: "ex" + i, done: i === 6, ex: true, createdAt: Date.now() - (7 - i) * 6e5,
    by: mine ? "หัวหน้ากะ" : "ออม", byUid: mine ? "demo-admin" : "demo-staff",
    doneBy: i === 6 ? "ออม" : "", doneByUid: i === 6 ? "demo-staff" : "", doneAt: i === 6 ? Date.now() - 18e5 : 0 };
});
// Example due times follow the clock so the demo always shows late, soon and later work.
const hhmm = mins => { const d = new Date(Date.now() + mins * 6e4); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); };
EXAMPLES[0].due = hhmm(40); EXAMPLES[1].due = hhmm(-15); EXAMPLES[3].due = hhmm(150);

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fmt = t => new Date(t).toLocaleString("th-TH", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
function toast(t, undo) {
  const el = $("#toast"); el.textContent = t; el.hidden = false;
  if (undo) { const b = document.createElement("button"); b.className = "toast-undo"; b.textContent = "ย้อนกลับ"; b.onclick = () => { el.hidden = true; undo(); }; el.append(b); }
  clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, undo ? 5000 : 2600);
}

// ---------------- prefs (this device) ----------------
const PKEY = "jarvis-prefs-v2";
let P = { name: "", from: "กะเช้า", to: "กะบ่าย", pin: "" };
try { Object.assign(P, JSON.parse(localStorage.getItem(PKEY) || "{}")); } catch (e) {}
const savePrefs = () => { try { localStorage.setItem(PKEY, JSON.stringify(P)); } catch (e) {} };

// ---------------- data store: local or Firestore ----------------
let ITEMS = [], BRIEFS = [];
const listeners = new Set();
const emit = () => listeners.forEach(f => f());

const LocalStore = (() => {
  const KEY = "jarvis-data-v3";
  let d = { items: EXAMPLES, briefs: [] };
  try { const raw = localStorage.getItem(KEY); if (raw) d = JSON.parse(raw); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} ITEMS = d.items; BRIEFS = d.briefs; emit(); };
  return {
    mode: "local",
    start() { ITEMS = d.items; BRIEFS = d.briefs; emit(); },
    async addItems(list) { d.items = [...list, ...d.items]; save(); },
    async updateItem(id, patch) { d.items = d.items.map(i => i.id === id ? { ...i, ...patch } : i); save(); },
    async deleteItem(id) { d.items = d.items.filter(i => i.id !== id); save(); },
    async clearExamples() { d.items = d.items.filter(i => !i.ex); save(); },
    async addBrief(b) { const id = uid(); d.briefs = [{ id, ...b }, ...d.briefs].slice(0, 40); save(); return id; },
    async ackBrief(id, ack) { d.briefs = d.briefs.map(b => b.id === id ? { ...b, acks: [...(b.acks || []), ack] } : b); save(); },
    async patchBrief(id, patch) { d.briefs = d.briefs.map(b => b.id === id ? { ...b, ...patch } : b); save(); },
  };
})();

// ---------------- accounts ----------------
// firebase: email + password through Firebase Auth (the real app)
// demo: accounts kept in this browser, for the preview only (window.JARVIS_DEMO_USERS)
// none: no sign-in; the name in Settings is used
const AUTH = CFG.firebase ? "firebase" : (Array.isArray(window.JARVIS_DEMO_USERS) ? "demo" : "none");
let ME = null; // { uid, email, name, role }
const myName = () => ME?.name || P.name || "";
const myUid = () => ME?.uid || "";
const isAdmin = () => ME?.role === "admin";

async function sha256(t) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
}

const Demo = {
  KEY: "jarvis-demo-users", SKEY: "jarvis-demo-session",
  users() { try { const r = localStorage.getItem(this.KEY); if (r) return JSON.parse(r); } catch (e) {} return (window.JARVIS_DEMO_USERS || []).map(u => ({ ...u })); },
  save(list) { try { localStorage.setItem(this.KEY, JSON.stringify(list)); } catch (e) {} },
  setSession(uid) { try { uid ? localStorage.setItem(this.SKEY, uid) : localStorage.removeItem(this.SKEY); } catch (e) {} },
  current() { let s = ""; try { s = localStorage.getItem(this.SKEY) || ""; } catch (e) {} return s ? this.users().find(u => u.uid === s && !u.disabled) || null : null; },
  async login(email, pass) {
    const e = email.trim().toLowerCase();
    const u = this.users().find(x => x.email === e);
    if (!u || u.disabled || u.hash !== await sha256(e + ":" + pass)) throw { code: "auth/invalid-credential" };
    this.setSession(u.uid);
    return u;
  },
};

let store = LocalStore;
let fb = null; // { auth, authM, db, fs, user }

async function startCloud() {
  if (AUTH !== "firebase") return;
  try {
    const V = "10.12.2";
    const [appM, authM, fs] = await Promise.all([
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`),
    ]);
    const app = appM.initializeApp(CFG.firebase);
    const auth = authM.getAuth(app);
    const db = fs.getFirestore(app);
    fb = { auth, authM, db, fs, user: null };
    loginReady(true);
    authM.onAuthStateChanged(auth, async user => {
      fb.user = user;
      if (!user) return setMe(null);
      let prof = {};
      try { const d = await fs.getDoc(fs.doc(db, "users", user.uid)); if (d.exists()) prof = d.data(); } catch (e) {}
      if (prof.disabled) { await authM.signOut(auth); return loginError("บัญชีนี้ถูกปิดการใช้งาน"); }
      useCloud();
      setMe({ uid: user.uid, email: user.email, name: prof.name || user.displayName || user.email.split("@")[0], role: prof.role || "staff" });
    });
  } catch (e) {
    console.warn("Firebase unavailable", e);
    loginError("เชื่อมต่อระบบไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วโหลดหน้าใหม่");
  }
}

let unsub = [];
function useCloud() {
  const { db, fs } = fb;
  const base = `teams/${CFG.teamId}`;
  const itemsCol = fs.collection(db, base, "items");
  const briefsCol = fs.collection(db, base, "briefs");
  unsub.forEach(u => u()); unsub = [];
  store = {
    mode: "cloud",
    start() {},
    async addItems(list) {
      const batch = fs.writeBatch(db);
      list.forEach(it => { const { id, ex, ...rest } = it; batch.set(fs.doc(itemsCol, id), rest); });
      await batch.commit();
    },
    updateItem: (id, patch) => fs.updateDoc(fs.doc(itemsCol, id), patch),
    deleteItem: id => fs.deleteDoc(fs.doc(itemsCol, id)),
    async clearExamples() {},
    async addBrief(b) { const id = uid(); await fs.setDoc(fs.doc(briefsCol, id), b); return id; },
    ackBrief: (id, ack) => fs.updateDoc(fs.doc(briefsCol, id), { acks: fs.arrayUnion(ack) }),
    patchBrief: (id, patch) => fs.updateDoc(fs.doc(briefsCol, id), patch),
  };
  const fail = e => { console.warn(e); toast(e.code === "permission-denied" ? "บัญชีนี้ยังไม่อยู่ในทีม ให้ผู้ดูแลเพิ่มก่อน" : "เชื่อมต่อฐานข้อมูลไม่ได้"); };
  unsub.push(fs.onSnapshot(fs.query(itemsCol, fs.orderBy("createdAt", "desc"), fs.limit(400)),
    snap => { ITEMS = snap.docs.map(d => ({ id: d.id, ...d.data() })); emit(); }, fail));
  unsub.push(fs.onSnapshot(fs.query(briefsCol, fs.orderBy("at", "desc"), fs.limit(40)),
    snap => { BRIEFS = snap.docs.map(d => ({ id: d.id, ...d.data() })); emit(); }, fail));
}

function setMe(u) {
  ME = u;
  if (!u && AUTH === "firebase") { unsub.forEach(f => f()); unsub = []; ITEMS = []; BRIEFS = []; }
  CHAT = [];
  showLogin(!u && AUTH !== "none");
  renderSync();
  emit();
}

// ---------------- login page ----------------
const AUTH_ERR = {
  "auth/invalid-credential": "อีเมลหรือรหัสผ่านไม่ถูกต้อง",
  "auth/wrong-password": "อีเมลหรือรหัสผ่านไม่ถูกต้อง",
  "auth/user-not-found": "อีเมลหรือรหัสผ่านไม่ถูกต้อง",
  "auth/invalid-email": "รูปแบบอีเมลไม่ถูกต้อง",
  "auth/too-many-requests": "ลองผิดหลายครั้ง รอสักครู่แล้วลองใหม่",
  "auth/user-disabled": "บัญชีนี้ถูกปิดการใช้งาน",
  "auth/network-request-failed": "เชื่อมต่อไม่ได้ ตรวจสอบอินเทอร์เน็ต",
};
function showLogin(on) {
  document.body.classList.toggle("locked", on);
  $("#v-login").hidden = !on;
  if (on) { ["home", "briefs"].forEach(x => $("#v-" + x).hidden = true); closeAll(); setTimeout(() => $("#lEmail").focus(), 50); }
  else { $("#lPass").value = ""; show(view === "login" ? "home" : view); }
}
function loginError(msg) { const e = $("#lErr"); e.textContent = msg; e.hidden = !msg; }
function loginReady(ok) { $("#lBtn").disabled = !ok; $("#lNote").textContent = ok ? "" : "กำลังเชื่อมต่อ…"; }
$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const email = $("#lEmail").value.trim(), pass = $("#lPass").value;
  if (!email || !pass) return loginError("ใส่อีเมลและรหัสผ่าน");
  loginError(""); const btn = $("#lBtn"); btn.disabled = true; btn.textContent = "กำลังเข้าสู่ระบบ…";
  try {
    if (AUTH === "demo") { const u = await Demo.login(email, pass); setMe({ uid: u.uid, email: u.email, name: u.name, role: u.role }); }
    else await fb.authM.signInWithEmailAndPassword(fb.auth, email, pass);

async function api(path, body) {

// ---------------- voice: Claude dictation, Web Speech, or keyboard ----------------
let claudeDict = null, claudeSample = null;
(async () => {
  if (!window.claude?.use) return;
  try { claudeDict = await window.claude.use("dictation"); } catch (e) {}
  try { claudeSample = await window.claude.use("sample"); } catch (e) {}
  if (claudeDict) {
    claudeDict.onFinal(({ text }) => voice.onFinal(text));
    claudeDict.onPartial(({ text }) => voice.onPartial(text));
    claudeDict.onState(({ state, reason }) => {
      voice.setLive(state !== "idle");
      if (state === "idle" && reason === "not_granted") toast("ไมค์ถูกปิดไว้ พิมพ์แทนได้");
      if (state === "idle" && reason === "unavailable") { claudeDict = null; renderMicHint(); }
    });
  }
  renderMicHint();
})();

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const voice = {
  live: false, want: false, rec: null,
  available() { return !!(claudeDict || SR); },
  onFinal(text) { const ta = $("#note"); if (!ta) return; const t = String(text); ta.value = ta.value ? (ta.value.replace(/\s+$/, "") + " " + t.trim()) : t.trim(); const p = $("#partial"); if (p) p.textContent = ""; },
  onPartial(text) { const p = $("#partial"); if (p) p.textContent = text; },
  setLive(on) {
    this.live = on;
    document.querySelectorAll(".orb").forEach(o => o.classList.toggle("live", on));
    const z = $(".mic-zone"); if (z) z.classList.toggle("live-wave", on);
    const b = $("#micBtn"); if (b) { b.classList.toggle("live", on); b.setAttribute("aria-label", on ? "หยุดฟังแล้วส่ง" : "พูด"); }
  },
  start() { // must be called inside a click
    if (claudeDict) {
      claudeDict.start({ language: "th" }).catch(e => {
        if (e.code === "unavailable") claudeDict.start().catch(() => {});
        else if (e.code === "not_granted") toast("ไม่ได้รับอนุญาตใช้ไมค์ พิมพ์แทนได้");
      });
      return;
    }
    if (!SR) return;
    this.want = true;
    const rec = this.rec = new SR();
    rec.lang = "th-TH"; rec.continuous = true; rec.interimResults = true;
    rec.onresult = ev => {
      let interim = "";
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const r = ev.results[i];
        if (r.isFinal) this.onFinal(r[0].transcript); else interim += r[0].transcript;
      }
      this.onPartial(interim);
    };
    rec.onerror = e => { if (e.error === "not-allowed" || e.error === "service-not-allowed") { this.want = false; toast("เบราว์เซอร์ไม่อนุญาตไมค์ พิมพ์หรือใช้ไมค์ของคีย์บอร์ดแทน"); } };
    rec.onend = () => { if (this.want) { try { rec.start(); return; } catch (e) {} } this.setLive(false); };
    try { rec.start(); this.setLive(true); } catch (e) { this.setLive(false); }
  },
  async stop() {
    this.want = false;
    if (claudeDict?.active()) { await claudeDict.stop().catch(() => {}); return; }
    const rec = this.rec; this.rec = null;
    if (rec) await new Promise(res => {
      const t = setTimeout(res, 1500);
      rec.onend = () => { clearTimeout(t); res(); };
      try { rec.stop(); } catch (e) { clearTimeout(t); res(); }
    });
    this.setLive(false);
  },
};

// Minutes from now until a "HH:MM" due time today (handles shifts that cross midnight).
function minsUntil(due) {
  if (!/^\d{1,2}:\d{2}$/.test(due || "")) return null;
  const [h, m] = due.split(":").map(Number);
  const now = new Date();
  let d = h * 60 + m - (now.getHours() * 60 + now.getMinutes());
  if (d < -720) d += 1440; else if (d > 720) d -= 1440;
  return d;
}
function relTime(mins) {
  const a = Math.abs(mins), h = Math.floor(a / 60), m = a % 60;
  const t = h ? `${h} ชม.${m ? " " + m + " นาที" : ""}` : `${m} นาที`;
  return mins < 0 ? `เลย ${t}` : mins === 0 ? "ถึงเวลาแล้ว" : `อีก ${t}`;
}
const isToday = t => t && new Date(t).toDateString() === new Date().toDateString();

// One order for the screen and the LINE brief: do now, by time, follow up, for info.
function groupTasks(items) {
  const open = items.filter(i => !i.done);
  const due = i => { const m = minsUntil(i.due); return m === null ? 1e9 : m; };
  const byDue = (a, b) => due(a) - due(b);
  const now = open.filter(i => i.pri === "urgent" || (i.pri !== "info" && due(i) < 0)).sort(byDue);
  const rest = open.filter(i => !now.includes(i));
  return [
    { key: "now", title: "ทำทันที", hint: "ด่วนหรือเลยเวลาแล้ว", list: now },
    { key: "timed", title: "ตามเวลา", hint: "มีเวลากำหนด เรียงจากใกล้สุด", list: rest.filter(i => i.pri !== "info" && i.due).sort(byDue) },
    { key: "follow", title: "ติดตามให้จบ", hint: "ยังไม่มีเวลากำหนด", list: rest.filter(i => i.pri !== "info" && !i.due) },
    { key: "info", title: "แจ้งให้ทราบ", hint: "อ่านแล้วติ๊กได้เลย", list: rest.filter(i => i.pri === "info") },
  ];
}

function taskHtml(it, tone) {
  const m = minsUntil(it.due);
  const vip = /VIP/i.test(it.guest);
  const guest = (it.guest || "").replace(/\s*\(VIP\)\s*/i, "").trim();
  const head = it.action || it.summary;
  const why = it.action ? it.summary : "";
  const timeCls = m === null ? "" : m < 0 ? "late" : m <= 60 ? "soon" : "";
  const time = it.done
    ? `<div class="t-time"><small>${it.doneBy ? "ปิดโดย " + esc(it.doneBy) : "เสร็จแล้ว"}</small>${it.doneAt ? `<small>${new Date(it.doneAt).toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" })}</small>` : ""}</div>`
    : it.due ? `<div class="t-time ${timeCls}"><b class="num">${esc(it.due)}</b><small>${relTime(m)}</small></div>` : "";
  return `<div class="task ${it.done ? "done" : tone}">
    <button class="check" data-check="${esc(it.id)}" aria-label="${it.done ? "เปิดงานนี้อีกครั้ง" : "ทำเสร็จแล้ว"}: ${esc(it.room)}" aria-pressed="${!!it.done}">${IC.check}</button>
    <button class="tb" data-id="${esc(it.id)}">
      <span class="t-who"><span class="t-room num">${esc(it.room || "—")}</span>${guest ? `<span>${esc(guest)}</span>` : ""}${vip ? '<span class="t-vip">VIP</span>' : ""}<span>${esc(CAT_NAME[it.cat] || "")}</span></span>
      <span class="t-do">${esc(head)}</span>
      ${why ? `<span class="t-why">${esc(why)}</span>` : ""}
      ${time}
    </button>
  </div>`;
}

  $("#sections").innerHTML = html;

}

const ACT_ICON = { add: "+", close: "✓", update: "✎", delete: "−", brief: "➤", miss: "!" };

function jarvisPayload() {
  const hist = [];
  for (const m of CHAT) {
    if (m.pending) continue;
    const done = (m.actions || []).filter(a => a.kind !== "miss" && !a.undone).map(a => a.label);
    const content = m.role === "assistant" && done.length ? `${m.content}\n[ทำแล้ว: ${done.join("; ")}]` : m.content;
    if (hist.length && hist[hist.length - 1].role === m.role) hist[hist.length - 1].content += "\n" + content;
    else hist.push({ role: m.role, content });
  }
  let messages = hist.slice(-12);
  while (messages.length && messages[0].role !== "user") messages = messages.slice(1);
  return {
    messages,
    board: ITEMS.slice(0, 200).map(i => ({ id: i.id, room: i.room, guest: i.guest, cat: i.cat, pri: i.pri, summary: i.summary, action: i.action, due: i.due, done: !!i.done })),
    now: new Date().toLocaleString("th-TH", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }),
    shift: `${P.from} → ${P.to}`, name: myName(), hintCat,
  };
}
function jarvisPromptText(p) {
  return `${JARVIS_RULES}

บอร์ดตอนนี้ (JSON):
${JSON.stringify(p.board)}

เวลา: ${p.now} · กะ: ${p.shift} · ผู้ใช้: ${p.name || "-"}${p.hintCat ? " · หมวดที่ผู้ใช้เลือกไว้: " + p.hintCat : ""}

บทสนทนา (ข้อความล่าสุดอยู่ท้ายสุด):
${p.messages.map(m => (m.role === "user" ? "ผู้ใช้: " : "Jarvis: ") + m.content).join("\n")}

ตอบเป็น JSON object เท่านั้น: {"reply": string, "actions": [{"type": "add|update|close|reopen|delete|brief", "id": string, "room": string, "guest": string, "cat": string, "pri": string, "summary": string, "action": string, "due": string}]}`;
}

async function submitJarvis(text) {
  text = String(text || "").trim();
  if (!text || jvBusy) return;
  jvBusy = true;
  const note = $("#note"); if (note) { note.value = ""; note.style.height = "auto"; }
  if (voice.live) await voice.stop();
  if (note) note.value = "";
  CHAT.push({ role: "user", content: text });
  const bot = { role: "assistant", content: "", pending: true };
  CHAT.push(bot); drawChat();
  let res = null, err = "";
  try {
    const payload = jarvisPayload();
    if (claudeSample) res = await claudeSample.json(jarvisPromptText(payload), { modelTier: "default" });
    else if (SERVER.ai) res = await api("jarvis", payload);
  } catch (e) { err = e.message || "Claude ไม่ตอบ"; }
  if (!res || typeof res !== "object") res = localJarvis(text);
  bot.actions = await applyActions(Array.isArray(res.actions) ? res.actions : []);
  bot.content = String(res.reply || "").trim() || (bot.actions.length ? "เรียบร้อยครับ" : "ยังไม่เข้าใจครับ ลองบอกเลขห้องกับสิ่งที่ต้องทำอีกครั้ง");
  if (err) bot.content += `\n(${err} จึงใช้โหมดพื้นฐาน)`;
  bot.pending = false;
  CHAT = CHAT.slice(-40);
  jvBusy = false;
  drawChat();
}

function describe(patch) {
  const parts = [];
  if (patch.pri) parts.push(PRI[patch.pri]);
  if (patch.due) parts.push("ภายใน " + patch.due);
  if (patch.cat) parts.push(CAT_NAME[patch.cat]);
  if (patch.room) parts.push("ห้อง " + patch.room);
  if (patch.guest) parts.push(patch.guest);
  if (patch.summary) parts.push(patch.summary);
  if (patch.action) parts.push("→ " + patch.action);
  return parts.join(" · ");
}

async function applyActions(acts) {
  const out = [];
  for (const a of acts.slice(0, 20)) {
    const type = a?.type;
    const it = a?.id ? ITEMS.find(i => i.id === a.id) : null;
    try {
      if (type === "add") {
        const n = { ...normalize(a), createdAt: Date.now(), by: myName(), byUid: myUid() };
        await store.addItems([n]);
        out.push({ kind: "add", label: `เพิ่ม ${n.room} · ${PRI[n.pri]}${n.due ? " " + n.due : ""} · ${n.summary}`, undo: () => store.deleteItem(n.id) });
      } else if (type === "brief") {
        const ids = String(a.id || "").split(",").map(s => s.trim()).filter(Boolean);
        const list = ids.length ? ITEMS.filter(i => ids.includes(i.id)) : ITEMS.filter(i => !i.done);
        if (!list.length) { out.push({ kind: "miss", label: "ไม่มีเรื่องค้างให้ส่ง" }); continue; }
        out.push({ kind: "brief", label: `สรุป ${list.length} งาน พร้อมส่งไลน์`, brief: { ids: list.map(i => i.id), title: ids.length ? "อัปเดตระหว่างกะ" : "สรุปทั้งกะ" } });
      } else if (!it) {
        out.push({ kind: "miss", label: `ไม่พบเรื่อง${a?.room ? "ห้อง " + a.room : ""}บนบอร์ด` });
      } else if (type === "close" || type === "reopen") {
        const done = type === "close";
        if (!!it.done === done) { out.push({ kind: "miss", label: `${it.room} ${done ? "ปิดไปแล้ว" : "ยังเปิดอยู่"}` }); continue; }
        const prev = { done: !!it.done, doneBy: it.doneBy || "", doneByUid: it.doneByUid || "", doneAt: it.doneAt || 0 };
        await store.updateItem(it.id, donePatch(done));
        if (done) afterClose(it.id);
        out.push({ kind: done ? "close" : "update", label: `${done ? "ปิด" : "เปิดใหม่"} ${it.room} · ${it.summary}`, undo: () => store.updateItem(it.id, prev) });
      } else if (type === "update") {
        const n = normalize(a), patch = {};
        for (const k of ["room", "guest", "summary", "action"]) if (a[k]) patch[k] = n[k];
        if (CAT_NAME[a.cat]) patch.cat = a.cat;
        if (PRI[a.pri]) patch.pri = a.pri;
        if (a.due && n.due) patch.due = n.due;
        if (!Object.keys(patch).length) continue;
        const prev = Object.fromEntries(Object.keys(patch).map(k => [k, it[k] ?? ""]));
        await store.updateItem(it.id, patch);
        out.push({ kind: "update", label: `แก้ ${it.room}: ${describe(patch)}`, undo: () => store.updateItem(it.id, prev) });
      } else if (type === "delete") {
        const keep = { ...it };
        await store.deleteItem(it.id);
        out.push({ kind: "delete", label: `ลบ ${it.room} · ${it.summary}`, undo: () => store.addItems([keep]) });
      }
    } catch (e) {
      out.push({ kind: "miss", label: "ทำไม่สำเร็จ: " + (e.code || e.message) });
    }
  }
  return out;
}

// Works without AI: a few common commands, otherwise treat the text as new items.
function localJarvis(text) {
  const rooms = [...text.matchAll(/\d{3,4}/g)].map(m => m[0]);
  const open = ITEMS.filter(i => !i.done);
  const firstOpen = r => open.find(i => i.room === r);
  if (/สรุป|ส่ง\s*(บรีฟ|เวร|ไลน์|line)|บรีฟ/i.test(text) && !/อะไร|บ้าง|กี่/.test(text)) return { reply: "สรุปให้แล้วครับ แตะ “ดูและส่ง”", actions: [{ type: "brief", id: "" }] };
  if (rooms.length && /เสร็จ|เรียบร้อย|ปิด|จบ|แก้แล้ว|done/i.test(text)) {
    const acts = rooms.map(firstOpen).filter(Boolean).map(i => ({ type: "close", id: i.id }));
    return { reply: acts.length ? `ปิดเรื่องห้อง ${acts.map(a => ITEMS.find(i => i.id === a.id).room).join(", ")} แล้วครับ` : "ไม่พบเรื่องที่ยังเปิดอยู่ของห้องนี้ครับ", actions: acts };
  }
  const pm = text.match(/(ด่วน|ติดตาม|แจ้งทราบ)/);
  if (rooms.length && pm && /เปลี่ยน|ปรับ|เป็น/.test(text)) {
    const pri = { "ด่วน": "urgent", "ติดตาม": "follow", "แจ้งทราบ": "info" }[pm[1]];
    const acts = rooms.map(firstOpen).filter(Boolean).map(i => ({ type: "update", id: i.id, pri }));
    return { reply: acts.length ? "ปรับให้แล้วครับ" : "ไม่พบห้องนี้บนบอร์ดครับ", actions: acts };
  }
  if (/อะไร|บ้าง|กี่|สรุป|\?/.test(text)) {
    const urgentOnly = /ด่วน/.test(text);
    const list = (urgentOnly ? open.filter(i => i.pri === "urgent") : open).sort((a, b) => ORDER[a.pri] - ORDER[b.pri]).slice(0, 10);
    return { reply: list.length ? `${urgentOnly ? "เรื่องด่วน" : "เรื่องค้าง"} ${list.length} เรื่องครับ\n` + list.map(i => `• ${i.room} ${i.summary}${i.due ? " (ภายใน " + i.due + ")" : ""}`).join("\n") : "ไม่มีเรื่องค้างครับ", actions: [] };
  }
  const adds = heuristic(text.replace(/^[^:]{1,30}:\s*/, ""), hintCat).map(x => ({ type: "add", ...x }));
  return { reply: `เพิ่ม ${adds.length} เรื่องลงบอร์ดแล้วครับ`, actions: adds };
}

function normalize(x) {
  return {
    id: uid(), room: String(x.room || "—").slice(0, 10), guest: String(x.guest || "").slice(0, 40),
    cat: CAT_NAME[x.cat] ? x.cat : "other", pri: PRI[x.pri] ? x.pri : "follow",
    summary: String(x.summary || "").slice(0, 300), action: String(x.action || "").slice(0, 300),
    due: /^\d{1,2}:\d{2}$/.test(x.due || "") ? x.due.padStart(5, "0") : "", done: false,
  };
}
function heuristic(text, cat) {
  const parts = text.split(/\n+|แล้วก็|อีกเรื่อง|ต่อมา|นอกจากนี้|(?=ห้อง\s*\d{3,4})/).map(s => (s || "").trim()).filter(s => s.length > 3);
  return (parts.length ? parts : [text]).map(p => {
    const room = (p.match(/(\d{3,4})/) || [])[1] || "—";
    let c = cat || "other";
    if (!cat) {
      if (/vip|arrival|มาถึง|เช็คอิน|check.?in/i.test(p)) c = "vip";
      else if (/ร้องเรียน|complain|ไม่พอใจ|บ่น|โวย/i.test(p)) c = "complaint";
      else if (/ซ่อม|แอร์|รั่ว|ไฟดับ|ช่าง|เสีย/i.test(p)) c = "maint";
      else if (/บิล|มัดจำ|เงิน|บัตร|จ่าย|deposit|bill/i.test(p)) c = "billing";
      else if (/ของหาย|ลืม|lost|found|เก็บได้/i.test(p)) c = "lost";
      else if (/late|แม่บ้าน|ทำความสะอาด|upgrade|ห้อง/i.test(p)) c = "room";
    }
    const pri = /ด่วน|ทันที|รีบ|ไม่พอใจ|โวย|urgent/i.test(p) ? "urgent" : /แจ้งไว้|ให้ทราบ/.test(p) ? "info" : "follow";
    const due = p.match(/\b(\d{1,2})[:.](\d{2})\b/);
    return { room, guest: "", cat: c, pri, summary: p.replace(/^(ห้อง)?\s*\d{3,4}\s*/, "").slice(0, 160), action: "", due: due ? `${due[1]}:${due[2]}` : "" };
  });
}

// ---------------- brief ----------------
function buildBrief(items, title) {
  const groups = groupTasks(items);
  const nowN = groups[0].list.length;
  const ICON = { now: "🔴", timed: "🟠", follow: "🟡", info: "🟢" };
  let t = `📋 ส่งเวร FO · ${P.from} → ${P.to}\n${title} · ${fmt(Date.now())}\n`;
  t += nowN ? `⚠️ ทำทันที ${nowN} งาน จากทั้งหมด ${items.length}\n` : `ไม่มีงานด่วน · ทั้งหมด ${items.length} งาน\n`;
  for (const g of groups) {
    if (!g.list.length) continue;
    t += `\n${ICON[g.key]} ${g.title} (${g.list.length})\n`;
    for (const it of g.list) {
      t += `• ${it.room}${it.guest ? " " + it.guest : ""}${it.due ? " · " + it.due : ""}\n   ${it.action || it.summary}\n`;
      if (it.action && it.summary) t += `   (${it.summary})\n`;
    }
  }
  t += `\nผู้ส่ง: ${myName() || "-"}\nรับเวรแล้วตอบ "รับ" ในกลุ่มนี้ด้วยครับ`;
  return t;
}
function briefSheet(items, title) {
  let briefId = null;
  openSheet(`<h3>สรุปส่งไลน์</h3>
    <div class="grid2">
      <div><label class="lab" for="from">กะที่ส่ง</label><input type="text" id="from" value="${esc(P.from)}"></div>
      <div><label class="lab" for="to">กะที่รับ</label><input type="text" id="to" value="${esc(P.to)}"></div>
    </div>
    ${ME ? "" : `<div><label class="lab" for="sender">ชื่อผู้ส่ง</label><input type="text" id="sender" placeholder="เช่น คิว (FOM)" value="${esc(P.name)}"></div>`}
    <pre class="brief" id="briefTxt"></pre>
    <div class="row" id="sendRow">
      ${SERVER.linePush ? `<button class="btn line" id="push">ส่งเข้ากลุ่มทีม</button>` : `<a class="btn line" id="ln" href="#" target="_blank" rel="noopener">เปิดใน LINE</a>`}
      <button class="btn sec" id="cp">คัดลอก</button>
    </div>
    <p class="err" id="sendErr" hidden></p>
    <p class="note">${SERVER.linePush ? "ส่งผ่านบัญชี LINE OA ของทีม เพื่อนตอบ “รับ” ในกลุ่มแล้วชื่อจะขึ้นในหน้าสรุปที่ส่ง" : "“เปิดใน LINE” จะเปิดหน้าเลือกแชท ถ้าไม่เปิด ให้คัดลอกแล้ววางในกลุ่มเอง"}</p>`);
  const upd = () => {
    P.from = $("#from").value.trim() || "กะเช้า"; P.to = $("#to").value.trim() || "กะบ่าย"; if ($("#sender")) P.name = $("#sender").value.trim(); savePrefs();
    const t = buildBrief(items, title);
    $("#briefTxt").textContent = t;
    const ln = $("#ln"); if (ln) ln.href = "https://line.me/R/share?text=" + encodeURIComponent(t);
    $("#shiftLabel").textContent = `${P.from} → ${P.to}`;
    return t;
  };
  ["from", "to", "sender"].forEach(id => $("#" + id)?.addEventListener("input", upd));
  upd();
  const log = async (text, via) => {
    if (briefId) { store.patchBrief(briefId, { text, via }).catch(() => {}); return briefId; }
    briefId = await store.addBrief({ at: Date.now(), text, title, n: items.length, urgent: items.filter(i => i.pri === "urgent").length, by: myName(), byUid: myUid(), from: P.from, to: P.to, via, acks: [] }).catch(() => null);
    return briefId;
  };
  $("#cp").onclick = () => { const t = upd(); copy(t); log(t, "คัดลอก"); };
  const ln = $("#ln"); if (ln) ln.onclick = () => { log(upd(), "LINE share"); };
  const push = $("#push");
  if (push) push.onclick = async () => {
    const t = upd(); push.disabled = true; push.textContent = "กำลังส่ง…"; $("#sendErr").hidden = true;
    try {
      const id = await log(t, "LINE OA");
      await api("line-push", { text: t, briefId: id });
      closeAll(); toast("ส่งเข้ากลุ่มแล้ว รอเพื่อนตอบ “รับ”");
    } catch (e) {
      $("#sendErr").textContent = e.message + " ลองคัดลอกแล้ววางเองได้"; $("#sendErr").hidden = false;
      push.disabled = false; push.textContent = "ส่งเข้ากลุ่มทีม";
    }
  };
}
$("#sendAll").onclick = () => {
  const open = ITEMS.filter(i => !i.done);
  if (!open.length) { toast("ไม่มีเรื่องค้าง กะนี้เคลียร์แล้ว"); return; }
  briefSheet(open, "สรุปทั้งกะ");
};
function copy(t) {
  const ok = () => toast("คัดลอกแล้ว วางในกลุ่ม LINE ได้เลย");
  const fallback = () => {
    const pre = $("#briefTxt") || document.querySelector("details[open] pre.brief");
    if (pre) { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("เลือกข้อความให้แล้ว กดคัดลอกเอง"); }
    else toast("คัดลอกไม่ได้ในเบราว์เซอร์นี้");
  };
  try { navigator.clipboard.writeText(t).then(ok, fallback); } catch (e) { fallback(); }
}

    <div class="chips" id="priChips">${Object.keys(PRI).map(p => `<button class="chip ${p} ${p === pri ? "on" : ""}" data-p="${p}">${PRI[p]}</button>`).join("")}</div>

    <div class="row"><button class="btn sec" id="saveIt">บันทึกการแก้ไข</button><button class="btn pri" id="doneIt">${it.done ? "เปิดงานอีกครั้ง" : "ทำเสร็จแล้ว"}</button></div>

    <p class="note" id="delAsk" hidden>แตะ “ยืนยันลบ” อีกครั้งเพื่อลบถาวร</p>`);
  $("#priChips").querySelectorAll("[data-p]").forEach(b => b.onclick = () => { pri = b.dataset.p; $("#priChips").querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c.dataset.p === pri)); });
  const patch = () => ({ pri, room: $("#eRoom").value.trim() || "—", due: $("#eDue").value, guest: $("#eGuest").value.trim(), summary: $("#eSum").value.trim(), action: $("#eAct").value.trim(), cat: $("#eCat").value });
  const run = (p, msg) => store.updateItem(it.id, p).then(() => { closeAll(); toast(msg); }).catch(e => { toast("บันทึกไม่สำเร็จ: " + (e.code || e.message)); throw e; });
  $("#saveIt").onclick = () => run(patch(), "บันทึกแล้ว");
  $("#doneIt").onclick = () => run({ ...patch(), ...donePatch(!it.done) }, it.done ? "เปิดงานอีกครั้งแล้ว" : `${it.room} เสร็จแล้ว${it.by && it.byUid !== myUid() ? " · แจ้ง " + it.by + " ให้แล้ว" : ""}`).then(() => { if (!it.done) afterClose(it.id); });
  let armed = false;
  $("#delIt").onclick = () => {
    if (!armed) { armed = true; $("#delIt").textContent = "ยืนยันลบ"; $("#delAsk").hidden = false; return; }
    store.deleteItem(it.id).then(() => { closeAll(); toast("ลบแล้ว"); });
  };
}

    <button class="btn pri" id="saveSet">บันทึก</button>`);
  $("#saveSet").onclick = () => {

async function openTeam() {
  openSheet(`<h3>จัดการทีม</h3><div id="teamList" class="team"><p class="note">กำลังโหลด…</p></div>
    <form id="addForm" class="bcard form" novalidate>

      <div><label class="lab" for="mPass">รหัสผ่านเริ่มต้น (อย่างน้อย 8 ตัว)</label><input type="text" id="mPass" autocomplete="off"></div>
      <div><label class="lab" for="mRole">สิทธิ์</label><select id="mRole"><option value="staff">พนักงาน</option><option value="admin">ผู้ดูแล (เพิ่ม/ปิดบัญชีได้)</option></select></div>
      <p class="err" id="mErr" hidden></p>
      <button class="btn pri" type="submit">เพิ่มเข้าทีม</button>
      <p class="note">แจ้งอีเมลและรหัสผ่านเริ่มต้นให้พนักงานเอง แล้วให้เปลี่ยนรหัสผ่านหลังเข้าสู่ระบบครั้งแรก</p>
    </form>`);
  const draw = async () => {
    let users;
    try { users = await Team.list(); } catch (e) { $("#teamList").innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
    $("#teamList").innerHTML = users.map(u => `<div class="member ${u.disabled ? "off" : ""}">
      <span class="avatar">${esc((u.name || "?").slice(0, 1).toUpperCase())}</span>
      <div class="m-t"><b>${esc(u.name)}${u.uid === myUid() ? " (คุณ)" : ""}</b><small>${esc(u.email)} · ${u.disabled ? "ปิดใช้งาน" : u.role === "admin" ? "ผู้ดูแล" : "พนักงาน"}</small></div>
      ${u.disabled || u.uid === myUid() ? "" : `<button class="mini" data-pw="${esc(u.uid)}">ตั้งรหัสใหม่</button><button class="mini" data-rm="${esc(u.uid)}">ปิดบัญชี</button>`}
    </div>`).join("");
    $("#teamList").querySelectorAll("[data-pw]").forEach(b => b.onclick = async () => {
      const row = b.closest(".member");
      if (row.querySelector(".pw-inline")) return;
      row.insertAdjacentHTML("beforeend", `<form class="pw-inline"><input type="text" placeholder="รหัสใหม่ อย่างน้อย 8 ตัว" aria-label="รหัสผ่านใหม่" autocomplete="off"><button class="mini gold" type="submit">บันทึก</button></form>`);
      const f = row.querySelector(".pw-inline");
      f.querySelector("input").focus();
      f.onsubmit = async e => { e.preventDefault(); try { await Team.setPassword(b.dataset.pw, f.querySelector("input").value); toast("ตั้งรหัสผ่านใหม่แล้ว"); f.remove(); } catch (x) { toast(x.message); } };
    });
    $("#teamList").querySelectorAll("[data-rm]").forEach(b => b.onclick = async () => {
      if (b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = "ยืนยันปิด"; return; }
      try { await Team.remove(b.dataset.rm); toast("ปิดบัญชีแล้ว"); draw(); } catch (x) { toast(x.message); }
    });
  };
  draw();
  $("#addForm").addEventListener("submit", async e => {
    e.preventDefault();
    const err = m => { $("#mErr").textContent = m; $("#mErr").hidden = !m; };
    try {
      await Team.add({ name: $("#mName").value.trim(), email: $("#mEmail").value.trim(), password: $("#mPass").value, role: $("#mRole").value });
      err(""); toast("เพิ่มเข้าทีมแล้ว"); ["mName", "mEmail", "mPass"].forEach(id => $("#" + id).value = ""); draw();
    } catch (x) { err(x.message || "เพิ่มไม่สำเร็จ"); }
  });
}
